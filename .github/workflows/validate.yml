name: Validate Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:openapi
      - run: npm run test:public-api
      - run: npm run test:api-reference
      - run: npm run test:http-references
      - run: npm run test:links
      - run: npm run build
      - run: npm run test:built-public-api

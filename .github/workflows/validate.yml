name: Validate Docs

on:
  push:
    branches: [main]
    tags: ['docs-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run validate

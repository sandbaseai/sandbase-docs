name: Deploy Docs

on:
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch:

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keep the release gate identical to the local production check so a
      # deployment cannot skip API-surface, link, OpenAPI, or Worker tests.
      - run: npm run validate
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            release_commit="$(git rev-list -n1 "$GITHUB_REF")"
            git merge-base --is-ancestor "$release_commit" origin/main
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Production dispatch must run from main."
            exit 1
          fi

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Cloudflare static assets
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 244d49f84a987ecfa2cf9480ed9d8628
        run: timeout --signal=TERM --kill-after=30s 15m npx --yes wrangler@4.126.0 deploy

      - name: Verify production URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://www.sandbase.ai/docs/health >/dev/null

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo '## Docs production deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Commit: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime: Cloudflare Workers Static Assets' >> "$GITHUB_STEP_SUMMARY"
          echo '- URL: https://www.sandbase.ai/docs/' >> "$GITHUB_STEP_SUMMARY"

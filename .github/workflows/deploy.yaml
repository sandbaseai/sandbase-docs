name: Deploy Docs

on:
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch:

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:built-public-api
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            release_commit="$(git rev-list -n1 "$GITHUB_REF")"
            git merge-base --is-ancestor "$release_commit" origin/main
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Production dispatch must run from main."
            exit 1
          fi

  build-and-deploy:
    needs: validate
    runs-on: [self-hosted, sandbase-docs]
    environment: production
    env:
      REGISTRY: sgccr.ccs.tencentyun.com/sandbase
      REGISTRY_HOST: sgccr.ccs.tencentyun.com
      NAMESPACE: sandbase
      DEPLOYMENT: sandbase-docs
      CONTAINER: docs
    steps:
      - uses: actions/checkout@v4

      - name: Select immutable image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="docs-v$(date -u +%Y%m%d%H%M%S)"
          fi
          image_tag="sha-${GITHUB_SHA}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Prepare isolated build cache generation
        shell: bash
        run: rm -rf /tmp/.buildx-cache-v2-next/docs

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/docs:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/docs:${{ steps.meta.outputs.release_tag }}
            ${{ env.REGISTRY }}/docs:latest
          cache-from: type=local,src=/tmp/.buildx-cache-v2/docs
          cache-to: type=local,dest=/tmp/.buildx-cache-v2-next/docs,mode=max
          provenance: false

      - name: Promote successful build cache
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/.buildx-cache-v2-next/docs/index.json ]; then
            rm -rf /tmp/.buildx-cache-v2/docs
            mkdir -p /tmp/.buildx-cache-v2
            mv /tmp/.buildx-cache-v2-next/docs /tmp/.buildx-cache-v2/docs
          fi

      - uses: ./.github/actions/setup-kubectl
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}
          k8s-server: ${{ secrets.K8S_SERVER }}

      - name: Roll out docs image
        id: rollout
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/docs:${IMAGE_TAG}"
          kubectl get deployment "$DEPLOYMENT" -n "$NAMESPACE" >/dev/null
          kubectl set image "deployment/${DEPLOYMENT}" "${CONTAINER}=${image}" -n "$NAMESPACE"
          kubectl rollout status "deployment/${DEPLOYMENT}" -n "$NAMESPACE" --timeout=300s
          live_image="$(
            kubectl get deployment "$DEPLOYMENT" -n "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="docs")].image}'
          )"
          test "$live_image" = "$image"
          ready_endpoints="$(
            kubectl get endpoints "$DEPLOYMENT" -n "$NAMESPACE" \
              -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{"\n"}{end}'
          )"
          test -n "$ready_endpoints"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify production URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            https://www.sandbase.ai/docs/health >/dev/null

      - name: Debug rollout failure
        if: failure()
        shell: bash
        run: |
          set +e
          kubectl get deployment,replicaset,pod,service,endpoints \
            -n "$NAMESPACE" -l app=sandbase-docs
          kubectl describe deployment "$DEPLOYMENT" -n "$NAMESPACE"
          kubectl logs -n "$NAMESPACE" -l app=sandbase-docs --tail=100

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo '## Docs production deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Release: `${{ steps.meta.outputs.release_tag }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Image: `${{ steps.rollout.outputs.image || 'rollout failed' }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- URL: https://www.sandbase.ai/docs/' >> "$GITHUB_STEP_SUMMARY"

        description: { type: string }
        agent_id: { type: string }
        agent_version: { type: integer, description: "Pinned Agent version." }
        input: { type: string }
        model: { type: string }
        status: { type: string, enum: [active, paused, archived] }
        row_version: { type: integer, description: "Schedule row_version also advances after every scheduled tick." }
        schedule: { $ref: '#/components/schemas/ScheduleSpec' }
        next_run_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

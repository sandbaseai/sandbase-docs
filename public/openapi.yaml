      type: object
      required: [id, object, deleted]
      properties:
        id: { type: string }
        object: { type: string, const: agent.session.deleted }
        deleted: { type: boolean, const: true }
    SessionTurn:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
        session_id: { type: string }
        agent_id: { type: string }
        status: { type: string }
    SessionCancelAccepted:

              schema: { $ref: '#/components/schemas/SkillCreated' }
        '400': { description: Invalid Skill source or metadata, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
        '401': { description: Missing API identity or organization context, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/TaskCostError' }, { $ref: '#/components/schemas/APIError' }] } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Skill could not be created, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    get:
      operationId: listSkills
      tags: [Skills]
      summary: List Skills
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 20 } }
      responses:
        '200':
          description: Skill list
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, page_size]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SkillListItem' } }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Skill list could not be loaded, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }

  /v1/skills/{id}:
    get:
      operationId: getSkill
      tags: [Skills]
      summary: Get a Skill
      parameters:
        - $ref: '#/components/parameters/SkillId'
      responses:
        '200':
          description: Skill details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '404': { description: Skill not found, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Skill could not be loaded, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    put:
      operationId: updateSkill
      tags: [Skills]
      summary: Update a Skill
      description: Replacement-style update for display fields. Omitted name, description, and categories are cleared; omitted source URL, preview URLs, metadata, and unified schema are preserved.
      parameters:
        - $ref: '#/components/parameters/SkillId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSkillRequest' }
      responses:
        '200':
          description: Skill updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '404': { description: Skill not found, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
        '400': { description: 'Invalid JSON body, field length, or unified schema', content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Skill could not be updated, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    delete:
      operationId: deleteSkill
      tags: [Skills]
      summary: Soft-delete a Skill
      parameters:
        - $ref: '#/components/parameters/SkillId'
      responses:
        '200':
          description: Skill deleted
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string, format: uuid }
                  deleted: { type: boolean, const: true }
        '404': { description: Skill not found, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Skill could not be deleted, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }

  # --- Credentials -----------------------------------------------
  /v1/credentials:
    post:
      operationId: createCredential
      tags: [Credentials]
      summary: Create credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400': { description: 'Missing, blank, oversized, unsupported, or otherwise invalid credential field', content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Credential could not be encrypted or created, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
    get:
      operationId: listCredentials
      tags: [Credentials]
      summary: List credentials
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '500': { description: Credential list could not be loaded, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
  /v1/credentials/{id}:
    get:
      operationId: getCredential
      tags: [Credentials]
      summary: Get credential (masked value)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^sec_' }
      responses:
        '200':
          description: Credential details (secret masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '404': { description: Credential not found or belongs to another organization, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
        '500': { description: Credential could not be loaded, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
    patch:
      operationId: updateCredential
      tags: [Credentials]
      summary: Update credential status or selection settings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^sec_' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400': { description: 'Invalid JSON body, unsupported status or strategy, non-positive weight, or no mutable fields', content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '404': { description: Credential not found or belongs to another organization, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
        '500': { description: Credential could not be updated, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
  /v1/credentials/{id}/rotate:
    post:
      operationId: rotateCredential
      tags: [Credentials]
      summary: Rotate credential value
      description: Replace the encrypted value and masked hint, then reset failure_count to 0 and clear cooldown_until.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^sec_' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  writeOnly: true
                  description: New plaintext value. Blank or whitespace-only values are rejected.
      responses:
        '200':
          description: Rotated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        '400': { description: 'Missing, blank, oversized, or invalid replacement value', content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
        '401': { description: Missing or invalid API key, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '402': { description: API key spending limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCostError' } } } }
        '403': { description: API key scope does not authorize this endpoint, content: { application/json: { schema: { $ref: '#/components/schemas/APIKeyScopeError' } } } }
        '404': { description: Credential not found or belongs to another organization, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
        '500': { description: Credential value could not be encrypted or stored, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyResourceError' } } } }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: SandBase API key. Treat the complete credential as an opaque secret.
    AnthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: "Supported only by `POST /v1/messages` for Anthropic SDK compatibility"
    GoogleApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Supported by Google Gemini-compatible endpoints. Takes precedence over the other key locations.
    GoogleQueryApiKey:
      type: apiKey
      in: query
      name: key
      description: Google SDK compatibility fallback. Prefer x-goog-api-key or Authorization because URLs can be logged.

  parameters:
    GeminiModel:
      name: model
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Bare Gemini model name, such as gemini-2.5-flash. SandBase adds the google/ catalog prefix.
    EndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Service ID (`ep_` prefix)
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^agent_'
      description: Agent ID
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Session ID
    DeploymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^depl_'
      description: Deployment ID
    SkillId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Skill UUID
  schemas:
    # --- Skills ---------------------------------------------------
    SkillFile:
      type: object
      required: [url, key, filename, size, content_type]
      properties:
        url: { type: string, format: uri }
        key: { type: string }
        filename: { type: string }
        size: { type: integer }
        content_type: { type: string }

    CreateSkillRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, pattern: '.*\S.*' }
        description: { type: [string, 'null'], maxLength: 1000 }
        categories: { type: [array, 'null'], items: { type: string } }
        skill_file_url: { type: string, minLength: 1, pattern: '.*\S.*' }
        git_url: { type: string, minLength: 1, pattern: '.*\S.*' }
        preview_image_urls: { type: [array, 'null'], items: { type: string } }
        metadata: { type: [object, 'null'], additionalProperties: true }
        unified_schema: { type: [object, 'null'], additionalProperties: true }
      anyOf:
        - required: [skill_file_url]
        - required: [git_url]

    UpdateSkillRequest:
      type: object
      description: Omitted name, description, and categories are cleared. Omitted preview_image_urls, skill_file_url, metadata, and unified_schema preserve their stored values.
      properties:
        name: { type: [string, 'null'], maxLength: 100, description: 'New display name. Omitted, null, or blank clears display_name; the immutable full Skill ref in name is unchanged.' }
        description: { type: [string, 'null'], maxLength: 1000, description: Omitted or null clears the description. }
        categories: { type: [array, 'null'], items: { type: string }, description: 'Omitted or null clears categories; the detail response normalizes the result to an empty array.' }
        skill_file_url: { type: [string, 'null'], description: 'A non-blank value replaces the bundle URL; omitted, null, or blank preserves it.' }
        preview_image_urls: { type: [array, 'null'], items: { type: string }, description: 'Omitted or null preserves previews; an empty array clears them.' }
        metadata: { type: [object, 'null'], additionalProperties: true, description: 'Supplied non-reserved keys merge into stored metadata; omitted or null preserves them.' }
        unified_schema: { type: [object, 'null'], additionalProperties: true, description: 'Supplied value replaces the stored schema after validation; omitted or null preserves it.' }

    SkillCreated:
      type: object
      required: [id, name, display_name, vendor_slug, plugin_slug, icon_url, preview_urls, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Full vendor_slug/plugin_slug reference. }
        display_name: { type: string }
        vendor_slug: { type: string }
        plugin_slug: { type: string }
        icon_url: { type: string }
        preview_urls: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    Skill:
      type: object
      required: [id, name, display_name, vendor_slug, plugin_slug, description, categories, icon_url, preview_urls, skill_file_url, git_url, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Full vendor_slug/plugin_slug reference. }
        display_name: { type: string }
        vendor_slug: { type: string }
        plugin_slug: { type: string }
        description: { type: string }
        categories: { type: array, items: { type: string } }
        icon_url: { type: string }
        preview_urls: { type: array, items: { type: string } }
        skill_file_url: { type: string }
        git_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillListItem:
      type: object
      required: [id, name, display_name, vendor_slug, plugin_slug, description, icon_url, preview_urls, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Full vendor_slug/plugin_slug reference. }
        display_name: { type: string }
        vendor_slug: { type: string }
        plugin_slug: { type: string }
        description: { type: string }
        icon_url: { type: string }
        preview_urls: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # --- Account --------------------------------------------------
    AccountBalance:
      type: object
      required: [org_id, balance, credit_limit, alert_threshold]
      properties:
        org_id:
          type: string
          format: uuid
        balance:
          type: string
          description: Current organization balance in USD, serialized as an exact decimal string.
        credit_limit:
          oneOf:
            - type: string
            - type: 'null'
          description: Optional USD credit limit. Null means no credit limit.
        alert_threshold:
          oneOf:
            - type: string
            - type: 'null'
          description: Optional USD balance alert threshold.

    AccountHistoryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountHistoryItem'
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    AccountHistoryItem:
      type: object
      required: [id, model, type, execution_mode, status, latency_ms, user_cost, prompt_tokens, completion_tokens, total_tokens, cached_tokens, cache_creation_tokens, created_at, api_key_prefix]
      properties:
        id: { type: string, description: Opaque execution ID. }
        model: { type: string }
        type: { type: string }
        execution_mode: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, timeout] }
        latency_ms: { type: integer, minimum: 0 }
        user_cost:
          type: string
          description: USD cost serialized as an exact decimal string.
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cached_tokens: { type: integer, minimum: 0 }
        cache_creation_tokens: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        api_key_prefix: { type: string }
        error_message: { type: string, description: Sanitized failure message when recorded. }
        error_type: { type: string }
        completed_at: { type: string, format: date-time }
        period_settled_cost:
          type: string
          pattern: '^-?\d+\.\d{6}$'
          description: Settlement cost attributed to the selected settlement window when available.
        input_params:
          description: Parsed stored request parameters; omitted when absent or invalid JSON.
        output_result:
          description: Parsed stored output; numbers retain their JSON precision. Omitted when absent or invalid JSON.

    # --- Tasks ----------------------------------------------------
    RunRequest:
      type: object
      required: [model]
      description: Capability-specific request. Resolve the selected model's live input schema before sending fields.
      properties:
        model:
          type: string
          description: Current model or API capability identifier from the SandBase catalog.
        mode:
          type: string
          enum: [auto, sync, async, stream]
          default: auto
          description: Execution mode when supported by the selected capability. Auto uses the capability's configured default.
        stream:
          type: boolean
          default: false
          description: Requests streaming output. Equivalent to mode stream and valid only for a capability that supports streaming.
        webhook_url:
          type: string
          format: uri
          description: Optional public HTTPS callback URL for asynchronous image, video, audio, or API tasks. It is validated only for those tasks and ignored for other execution types.
      additionalProperties: true

    RunResponse:
      type: object
      required: [id, status, model]
      properties:
        id:
          type: string
          description: Opaque execution identifier. Use exactly as returned; no prefix is guaranteed.
        model: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed, timeout]
          description: A stored completed task can temporarily be reported as running while output transfer is still pending.
        outputs:
          type: array
          description: Extracted generated outputs when available. Omitted from non-terminal responses and also from completed responses whose output is empty, malformed, unsupported, or not yet transferred.
          items:
            type: object
            properties:
              url: { type: string, description: 'Provider output string, commonly an HTTP URL or data URI; syntax is not revalidated by this projection.' }
              content_type: { type: string }
            additionalProperties: true
        error:
          type: object
          description: Structured sanitized error for failed or timed-out runs when the stored error message is non-empty; otherwise omitted.
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string }
        usage:
          type: object
          additionalProperties: true
          description: Model-specific public usage details when available; omitted for models that do not report them.

    UploadMediaRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Image (up to 20 MB), audio (up to 50 MB), or video (up to 500 MB).
        type:
          type: string
          enum: [image, audio, video]
          description: Optional category hint. The server still uses the detected MIME type for validation and storage.

    UploadMediaResponse:
      type: object
      required: [url, filename, size, type, content_type]
      properties:
        url:
          type: string
          description: Stored media URL to pass to a supported model input.
        filename:
          type: string
          description: Original multipart filename.
        size:
          type: integer
          minimum: 0
          description: Uploaded file size in bytes.
        type:
          type: string
          description: Detected MIME type. This currently matches content_type.
        content_type:
          type: string
          description: Detected MIME type used when storing the file.

    CreateAssetRequest:
      type: object
      required: [url, asset_type]
      properties:
        url:
          type: string
          minLength: 1
          description: Source URL forwarded to the asset provider. SandBase requires a non-empty string; the provider must be able to fetch it.
        asset_type:
          type: string
          enum: [Image, Video, Audio]
        name: { type: string }

    CreateAssetResponse:
      type: object
      required: [id, asset_url, asset_type, created_at]
      properties:
        id: { type: string }
        asset_url:
          type: string
          description: Persistent asset:// reference used in generation requests.
        asset_type:
          type: string
          enum: [Image, Video, Audio]
        name: { type: string }
        created_at: { type: string, format: date-time }

    GetAssetResponse:
      type: object
      required: [id, external_id, asset_url, status, asset_type, download_url, created_at]
      properties:
        id: { type: string }
        external_id: { type: string }
        asset_url:
          type: string
          description: Persistent asset:// reference used in generation requests.
        asset_type:
          type: string
          enum: [Image, Video, Audio]
        name: { type: string }
        status:
          type: string
          description: Provider-reported asset status, returned without normalization.
        download_url:
          type: string
          description: Provider-returned download URL. It can be empty until the provider makes a URL available.
        created_at: { type: string, format: date-time }

    TaskCostResponse:
      type: object
      required: [id, status, settled, currency, cost, estimated_cost, usage]
      properties:
        id:
          type: string
          description: SandBase task ID.
        status:
          type: string
          enum: [pending, running, completed, failed, timeout]
        settled:
          type: boolean
          description: Whether final cost settlement has completed.
        currency:
          type: string
          enum: [USD]
        cost:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: USD amount with six decimal places. Not final while settled is false.
          example: '0.001234'
        estimated_cost:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: Best-effort USD estimate with six decimal places. Informational while settled is false; matches cost once settled is true.
          example: '0.001234'
        usage:
          $ref: '#/components/schemas/TaskCostUsage'

    TaskCostUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens, cached_tokens, cache_creation_tokens, reasoning_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        cached_tokens:
          type: integer
          minimum: 0
        cache_creation_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0

    TaskCostError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    APIPassthroughResponse:
      description: Capability-specific response. Its shape is defined by the selected live catalog capability and may be an object, array, or scalar.

    APIPassthroughError:
      description: Route-resolution, authentication, admission, or unified-pipeline error.
      anyOf:
        - $ref: '#/components/schemas/TaskCostError'
        - $ref: '#/components/schemas/APIKeyScopeError'
        - type: object
          required: [error, message]
          properties:
            error: { type: string }
            message: { type: string }

    # --- Models ---------------------------------------------------
    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIModelListItem'

    OpenAIModelListItem:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          description: Logical model name used in inference requests.
        object: { type: string, const: model }
        created: { type: integer, description: Unix creation timestamp. }
        owned_by: { type: string, description: Representative enabled provider or sandbase. }

    ModelDetail:
      type: object
      description: Detailed model response. Pricing is returned only in the optional model_card object.
      required: [id, name, display_name, vendor, description, type, capability_tags, skills, unified_schema, execution_mode, supported_modes, run_count, sort_order, published_at, vendor_slug, model_slug, enabled, featured, created_at, examples]
      properties:
        id:
          type: string
          format: uuid
          description: Internal model resource ID. Use name in inference requests.
        name:
          type: string
          example: openai/gpt-4o
        display_name:
          type: string
          example: GPT-4o
        vendor:
          type: string
        description:
          type: string
        type:
          type: string
        capability_tags:
          type: [array, 'null']
          items:
            type: string
        skills:
          type: array
          description: String capability tags derived from capability_tags; empty when tags are absent or invalid.
          items:
            type: string
        unified_schema:
          type: [object, 'null']
          additionalProperties: true
        execution_mode:
          type: string
        supported_modes:
          type: [array, 'null']
          items:
            type: string
        run_count:
          type: integer
        sort_order:
          type: integer
        published_at:
          type: [string, 'null']
          format: date-time
        vendor_slug:
          type: string
        model_slug:
          type: string
        enabled:
          type: boolean
        featured:
          type: boolean
        created_at:
          type: string
          format: date-time
        model_card:
          $ref: '#/components/schemas/ModelCard'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/ModelExample'

    ModelExample:
      type: object
      required: [id, is_default, created_at]
      properties:
        id: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        input_snapshot:
          description: Parsed JSON input snapshot. Omitted when absent or invalid.
        output_snapshot:
          description: Parsed JSON output snapshot. Omitted when absent or invalid.

    ModelCard:
      type: object
      description: Model pricing and presentation data.
      required: [base_price, prompt_token_price, completion_token_price, cache_read_multiplier, cache_write_multiplier, cache_write_1h_multiplier, reasoning_price, price_formula, markup_ratio, readme, cover_url]
      properties:
        base_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        prompt_token_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        completion_token_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        cache_read_multiplier:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        cache_write_multiplier:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        cache_write_1h_multiplier:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        reasoning_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        price_formula:
          type: string
        markup_ratio:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        readme:
          type: string
        cover_url:
          type: string

    # --- Responses ------------------------------------------------
    ResponsesRequest:
      type: object
      required: [model]
      additionalProperties: true
      description: OpenAI-compatible request. SandBase rewrites model for the selected provider and preserves other fields.
      properties:
        model:
          type: string
          description: Model identifier from the Models API.
        input:
          description: Text, message items, or other input supported by the selected model and provider.
        instructions:
          type: string
        stream:
          type: boolean
          default: false
          description: Return sanitized OpenAI Responses Server-Sent Events.
        background:
          type: boolean
        include:
          type: array
          items: { type: string }
        max_output_tokens:
          type: integer
          minimum: 1
        max_tool_calls:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
        parallel_tool_calls:
          type: boolean
        previous_response_id:
          type: string
        reasoning:
          type: object
          additionalProperties: true
        service_tier:
          type: string
        store:
          type: boolean
        temperature:
          type: number
        text:
          type: object
          additionalProperties: true
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        top_logprobs:
          type: integer
        top_p:
          type: number
        truncation:
          type: string
        user:
          type: string

    ResponsesResponse:
      type: object
      additionalProperties: false
      description: >-
        Public OpenAI Responses fields retained by SandBase. Provider-specific top-level fields are removed;
        output items remain provider-compatible free-form objects.
      properties:
        id: { type: string }
        object: { type: string }
        created_at: { type: integer }
        status: { type: string }
        error:
          type: [object, 'null']
          additionalProperties: true
        incomplete_details:
          type: [object, 'null']
          additionalProperties: true
        instructions:
          type: [string, 'null']
        max_output_tokens: { type: [integer, 'null'] }
        max_tool_calls: { type: [integer, 'null'] }
        model: { type: string }
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        parallel_tool_calls: { type: boolean }
        previous_response_id: { type: [string, 'null'] }
        reasoning:
          type: [object, 'null']
          additionalProperties: true
        store: { type: boolean }
        temperature: { type: [number, 'null'] }
        text:
          type: object
          additionalProperties: true
        tool_choice: {}
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        top_logprobs: { type: integer }
        top_p: { type: [number, 'null'] }
        truncation: { type: string }
        usage:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens, total_tokens, input_tokens_details, output_tokens_details]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
            input_tokens_details:
              type: object
              additionalProperties: false
              required: [cached_tokens]
              properties:
                cached_tokens: { type: integer, minimum: 0 }
            output_tokens_details:
              type: object
              additionalProperties: false
              required: [reasoning_tokens]
              properties:
                reasoning_tokens: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: true
        service_tier: { type: string }
        user: { type: string }
        background: { type: boolean }

    # --- Chat Completions -----------------------------------------
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: OpenAI-compatible request. Additional provider-compatible fields are forwarded when supported by the selected route.
      properties:
        model:
          type: string
          description: Model identifier
          example: "openai/gpt-5.4"
        messages:
          type: array
          items:
            type: object
            required: [role]
            additionalProperties: true
            properties:
              role:
                type: string
                description: Message role supported by the selected provider, such as system, developer, user, assistant, or tool.
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: 'null'
              name:
                type: string
              tool_calls:
                type: array
              tool_call_id:
                type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        top_p:
          type: number
        max_tokens:
          type: integer
        stream:
          type: boolean
          default: false
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          items:
            type: object
        mcp_servers:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/MCPServer' }
        tool_choice:
          oneOf:
            - type: string
            - type: object
        parallel_tool_calls:
          type: boolean
        user:
          type: string
        response_format:
          type: object
        reasoning_effort:
          type: string
          description: Provider-compatible reasoning effort setting.
        reasoning:
          type: object
          additionalProperties: true
          description: Reasoning configuration; common fields include effort and max_tokens.
        thinking:
          type: object
          additionalProperties: true
          description: Thinking configuration; common fields include type and budget_tokens.
        extra_body:
          type: object
          additionalProperties: true
          description: Provider-specific parameters used when SandBase translates the request between protocols.
        n:
          type: integer
          default: 1
        presence_penalty:
          type: number
        frequency_penalty:
          type: number
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      additionalProperties: true
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason, logprobs]
            additionalProperties: true
            properties:
              index:
                type: integer
              message:
                type: object
                required: [role, content]
                additionalProperties: true
                properties:
                  role:
                    type: string
                  content:
                    type: [string, 'null']
                  tool_calls:
                    type: array
                  reasoning_content:
                    type: [string, 'null']
              finish_reason:
                type: [string, 'null']
                description: Provider finish reason. Values can vary by model and provider.
              logprobs:
                description: Token log probabilities when requested and supported; otherwise null.
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens, prompt_tokens_details, completion_tokens_details]
          additionalProperties: true
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
            prompt_tokens_details:
              type: object
              required: [cached_tokens, cache_write_tokens]
              properties:
                cached_tokens: { type: integer }
                cache_write_tokens: { type: integer }
            completion_tokens_details:
              type: object
              required: [reasoning_tokens]
              properties:
                reasoning_tokens: { type: integer }

    ChatCompletionError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: ['null', string] }
            param: { type: ['null', string] }

    AnthropicMessageResponse:
      type: object
      additionalProperties: true
      description: Anthropic-compatible response forwarded from the selected provider. Fields can vary with beta features.
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        model: { type: string }
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        stop_reason:
          type: [string, 'null']
        stop_sequence:
          type: [string, 'null']
        usage:
          type: object
          additionalProperties: true
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cache_read_input_tokens: { type: integer, minimum: 0 }
            cache_creation_input_tokens: { type: integer, minimum: 0 }
            cache_creation:
              type: object
              additionalProperties: true
              properties:
                ephemeral_5m_input_tokens: { type: integer, minimum: 0 }
                ephemeral_1h_input_tokens: { type: integer, minimum: 0 }

    AnthropicError:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [type, message]
          additionalProperties: true
          properties:
            type:
              type: string
              description: Anthropic error type, such as invalid_request_error, authentication_error, permission_error, request_too_large, rate_limit_error, or api_error.
            message: { type: string }

    GeminiGenerateContentRequest:
      type: object
      additionalProperties: true
      description: Google Gemini GenerateContent request. Unknown top-level fields are ignored by the current translator.
      properties:
        contents:
          type: array
          items: { $ref: '#/components/schemas/GeminiContent' }
        systemInstruction:
          $ref: '#/components/schemas/GeminiContent'
        generationConfig:
          type: object
          additionalProperties: true
          properties:
            temperature: { type: number }
            topP: { type: number }
            topK: { type: integer }
            maxOutputTokens: { type: integer }
            stopSequences: { type: array, items: { type: string } }
            candidateCount: { type: integer, description: The current translator accepts only 1 when supplied. }
            seed: { type: integer }
            presencePenalty: { type: number }
            frequencyPenalty: { type: number }
            responseMimeType: { type: string, enum: [text/plain, application/json, text/x.enum] }
            responseSchema: { type: object, additionalProperties: true }
            responseModalities:
              type: array
              items: { type: string }
              description: The current translator supports TEXT only.
            thinkingConfig: { type: object, additionalProperties: true }
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        toolConfig: { type: object, additionalProperties: true }
        safetySettings:
          type: array
          items: { type: object, additionalProperties: true }
        cachedContent:
          type: string
          description: Passed through when the selected provider supports Gemini context caching.

    GeminiContent:
      type: object
      additionalProperties: true
      properties:
        role: { type: string, enum: [user, model] }
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Text, image inlineData, public HTTP(S) image fileData, functionCall, or functionResponse part.

    GeminiGenerateContentResponse:
      type: object
      additionalProperties: true
      properties:
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              content: { $ref: '#/components/schemas/GeminiContent' }
              finishReason: { type: string }
              index: { type: integer }
              safetyRatings: { type: array, items: { type: object, additionalProperties: true } }
        usageMetadata:
          type: object
          additionalProperties: true
          properties:
            promptTokenCount: { type: integer, minimum: 0 }
            candidatesTokenCount: { type: integer, minimum: 0 }
            totalTokenCount: { type: integer, minimum: 0 }
            cachedContentTokenCount: { type: integer, minimum: 0 }
            thoughtsTokenCount: { type: integer, minimum: 0 }
        promptFeedback: { type: object, additionalProperties: true }
        modelVersion: { type: string }
        responseId: { type: string }

    GeminiInteractionRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      description: |
        Google Interactions request. Except for fields used for routing and lifecycle control, fields are forwarded to
        the selected upstream. Agent interactions are not supported. background and stream cannot both be true.
      properties:
        model:
          type: string
          minLength: 1
          description: Logical SandBase model name. The response echoes this name instead of an upstream model identifier.
        input:
          description: Google Interactions input; it can be text, an object, or an array of typed input items.
        stream:
          type: boolean
          default: false
          description: Requests an SSE event stream when the selected model supports it.
        background:
          type: boolean
          default: false
          description: Requests durable background execution and an immediately pollable in_progress Interaction.
        previous_interaction_id:
          type: string
          description: Previous Interaction ID. SandBase keeps the request on the same upstream provider when the mapping is still available.
        store:
          type: boolean
          description: Forwarded upstream. Stored upstream state may be required for previous_interaction_id.
        system_instruction: { type: string }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        generation_config: { type: object, additionalProperties: true }
        response_format:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        response_modalities: { type: array, items: { type: string } }

    GeminiInteraction:
      type: object
      required: [id, object, model, status]
      additionalProperties: true
      properties:
        id:
          type: string
          description: Upstream Interaction ID used by GET and previous_interaction_id.
        object: { type: string, const: interaction }
        model:
          type: string
          description: Logical SandBase model name supplied by the client.
        role: { type: string }
        status:
          type: string
          enum: [in_progress, requires_action, completed, failed, cancelled, incomplete]
        created: { type: string }
        updated: { type: string }
        steps:
          type: array
          description: Polymorphic Google Interaction steps. Unknown step and content types are preserved.
          items: { type: object, additionalProperties: true }
        usage:
          $ref: '#/components/schemas/GeminiInteractionUsage'

    GeminiInteractionUsage:
      type: object
      additionalProperties: true
      properties:
        total_input_tokens: { type: integer, minimum: 0 }
        total_output_tokens: { type: integer, minimum: 0 }
        total_cached_tokens: { type: integer, minimum: 0 }
        total_thought_tokens: { type: integer, minimum: 0 }
        total_tool_use_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        input_tokens_by_modality:
          type: array
          items: { $ref: '#/components/schemas/GeminiInteractionModalityUsage' }
        output_tokens_by_modality:
          type: array
          items: { $ref: '#/components/schemas/GeminiInteractionModalityUsage' }

    GeminiInteractionModalityUsage:
      type: object
      required: [modality, tokens]
      additionalProperties: true
      properties:
        modality: { type: string }
        tokens: { type: integer, minimum: 0 }

    GeminiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          additionalProperties: true
          properties:
            code: { type: integer }
            message: { type: string }
            status:
              type: string
              description: Google canonical error status, such as INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, RESOURCE_EXHAUSTED, INTERNAL, UNAVAILABLE, or DEADLINE_EXCEEDED.

    VolcengineContentsGenerationRequest:
      type: object
      required: [model, content]
      additionalProperties: true
      properties:
        model:
          type: string
          enum: [doubao-seedance-2-0-260128, doubao-seedance-2-0-fast-260128, doubao-seedance-2-5-260628]
        content:
          type: array
          minItems: 1
          description: Must include text. Media items select image-to-video or reference-to-video mode according to role.
          items: { $ref: '#/components/schemas/VolcengineContentItem' }
        callback_url: { type: string, minLength: 1, description: Receives the terminal task response. }
        duration: { type: integer }
        resolution: { type: string }
        ratio: { type: string }
        generate_audio: { type: boolean }
        seed: { type: integer }
        camera_fixed: { type: boolean }
        watermark: { type: boolean }
        draft: { type: boolean }
        return_last_frame: { type: boolean }
        service_tier: { type: string }
        execution_expires_after: { type: integer }
        frames: { type: integer }
        framespersecond: { type: integer }
        tools: { type: array, items: { type: object, additionalProperties: true } }

    VolcengineContentItem:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string, enum: [text, image_url, video_url, audio_url] }
        text: { type: string }
        image_url:
          oneOf:
            - { type: string }
            - { type: object, required: [url], properties: { url: { type: string } } }
        video_url:
          oneOf:
            - { type: string }
            - { type: object, required: [url], properties: { url: { type: string } } }
        audio_url:
          oneOf:
            - { type: string }
            - { type: object, required: [url], properties: { url: { type: string } } }
        role: { type: string, enum: [first_frame, last_frame, reference_image, reference_video, reference_audio] }

    VolcengineTaskCreated:
      type: object
      required: [id]
      properties:
        id: { type: string }

    VolcengineTask:
      type: object
      required: [id, model, status, created_at, updated_at, content, usage]
      additionalProperties: true
      properties:
        id: { type: string }
        model: { type: string }
        status: { type: string, enum: [queued, running, cancelled, succeeded, failed, expired] }
        created_at: { type: integer, format: int64, description: Unix timestamp in seconds. }
        updated_at: { type: integer, format: int64, description: Unix timestamp in seconds. }
        content:
          type: object
          properties:
            video_url: { type: string }
            last_frame_url: { type: string }
            file_url: { type: string }
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens, prompt_tokens_details, completion_tokens_details]
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
            prompt_tokens_details: { type: object, additionalProperties: true }
            completion_tokens_details: { type: object, additionalProperties: true }
        error: { $ref: '#/components/schemas/VolcengineTaskFailure' }
        failure_reason: { $ref: '#/components/schemas/VolcengineTaskFailure' }

    VolcengineTaskFailure:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    VolcengineTaskList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VolcengineTask' } }
        total: { type: integer, minimum: 0 }

    VolcengineError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type]
          properties:
            code: { type: string, description: 'InvalidParameter, AuthenticationError, PermissionDenied, ResourceNotFound, RateLimitExceeded, or InternalServiceError.' }
            message: { type: string }
            type: { type: string, description: HTTP-style Volcengine error type. }

    # --- Embeddings -----------------------------------------------
    EmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      description: OpenAI-compatible request. Additional provider-compatible fields are forwarded unchanged.
      properties:
        model:
          type: string
          description: Embedding model identifier.
          example: "alibaba/text-embedding-v4"
        input:
          description: Text, token IDs, or a batch of texts or token-ID arrays to embed. Provider limits apply.
          oneOf:
            - type: string
              example: "SandBase provides a unified API for AI models, agents, and developer tools."
            - type: array
              items:
                type: string
              example:
                - "First document"
                - "Second document"
            - type: array
              items:
                type: integer
            - type: array
              items:
                type: array
                items:
                  type: integer
        dimensions:
          type: integer
          minimum: 1
          description: Optional output dimension when supported by the selected model. SandBase does not impose a universal dimension list.
          example: 1024
        encoding_format:
          type: string
          description: Requested embedding encoding. Support is provider- and model-specific.
          enum: [float, base64]
          default: float

    EmbeddingResponse:
      type: object
      required: [object, data, model, usage]
      additionalProperties: true
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            additionalProperties: true
            properties:
              object:
                type: string
                enum: [embedding]
              index:
                type: integer
              embedding:
                oneOf:
                  - type: array
                    items:
                      type: number
                      format: float
                  - type: string
                    description: Base64-encoded vector when encoding_format is base64.
        model:
          type: string
          example: "alibaba/text-embedding-v4"
        usage:
          type: object
          required: [prompt_tokens, total_tokens]
          additionalProperties: true
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer

    EmbeddingError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: ['null', string] }
            param: { type: ['null', string] }

    # --- OpenAI-compatible Images --------------------------------
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model:
          type: string
          const: gpt-image-2
        prompt:
          type: string
          minLength: 1
        n:
          type: integer
          minimum: 1
        size:
          type: string
          description: Output size supported by gpt-image-2, such as 1024x1024, 1024x1536, 1536x1024, or auto.
        quality:
          type: string
          description: Output quality supported by gpt-image-2, such as low, medium, high, or auto.
        background:
          type: string
          description: Background setting such as transparent, opaque, or auto.
        output_format:
          type: string
          description: Output encoding such as png, webp, or jpeg.
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        moderation:
          type: string
        user:
          type: string
        stream:
          type: boolean
          const: false
          default: false
          description: Streaming is not supported by this SandBase endpoint.
        mode:
          type: string
          const: sync
          default: sync

    ImageEditRequest:
      type: object
      required: [model, prompt, image]
      additionalProperties: true
      properties:
        model:
          type: string
          const: gpt-image-2
        prompt:
          type: string
          minLength: 1
        image:
          oneOf:
            - type: string
              format: binary
            - type: array
              items:
                type: string
                format: binary
          description: Source image file. Repeat the multipart field to provide multiple images.
        mask:
          type: string
          format: binary
        n:
          type: integer
          minimum: 1
        size:
          type: string
        quality:
          type: string
        background:
          type: string
        input_fidelity:
          type: string
        output_format:
          type: string
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        user:
          type: string
        stream:
          type: boolean
          const: false
          default: false
          description: Streaming is not supported by this SandBase endpoint.
        mode:
          type: string
          const: sync
          default: sync

    ImagesResponse:
      type: object
      required: [data, usage]
      additionalProperties: true
      properties:
        created:
          type: integer
        data:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            anyOf:
              - required: [b64_json]
              - required: [url]
            properties:
              b64_json:
                type: string
                description: Base64-encoded image data.
              url:
                type: string
                format: uri
              revised_prompt:
                type: string
        usage:
          type: object
          required: [input_tokens, output_tokens, total_tokens, input_tokens_details]
          additionalProperties: true
          properties:
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
            total_tokens:
              type: integer
              minimum: 0
            input_tokens_details:
              type: object
              required: [text_tokens, image_tokens]
              additionalProperties: true
              properties:
                text_tokens: { type: integer, minimum: 0 }
                image_tokens: { type: integer, minimum: 0 }
                cached_text_tokens: { type: integer, minimum: 0 }
                cached_image_tokens: { type: integer, minimum: 0 }
                cached_tokens: { type: integer, minimum: 0 }

    OpenAIImagesError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: ['null', string] }
            param: { type: ['null', string] }

    APIKeyScopeError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, const: insufficient_scope }
            message: { type: string }
            request_id: { type: string }

    LegacyResourceError:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }

    # --- Services (Endpoint resources) -----------------------------
    CreateDeclarativeEndpointRequest:
      type: object
      additionalProperties: false
      required: [name, runtime, protocols]
      properties:
        name:
          type: string
          maxLength: 200
        runtime:
          type: string
          description: Enabled runtime profile. This release supports hermes.
          example: hermes
        description:
          type: string
        model:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        system:
          type: string
        skills:
          type: [array, 'null']
          maxItems: 20
          description: |
            Full vendor_slug/plugin_slug references. Hermes runtime identity and installation lookup use each
            bundle-root SKILL.md frontmatter name; the plugin slug and runtime name may differ.
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
        tools:
          type: [array, 'null']
          maxItems: 1
          items:
            $ref: '#/components/schemas/EndpointToolset'
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          description: Explicit public invocation transports. Always send this field; public clients may enable REST, MCP, experimental ACP, or any supported combination.
          items:
            type: string
            enum: [rest, mcp, acp]

    CreateAdvancedEndpointRequest:
      type: object
      additionalProperties: false
      required: [name, agent_id, protocols]
      properties:
        name:
          type: string
        slug:
          type: string
        agent_id:
          type: string
        agent_version:
          type: integer
          minimum: 1
        environment_id:
          type: string
          deprecated: true
          description: Optional compatibility assertion; the Agent runtime Environment is resolved automatically.
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          description: Explicit public invocation transports. Always send this field; public clients may enable REST, experimental ACP, or both.
          items:
            type: string
            enum: [rest, mcp, acp]
        config:
          type: object
          additionalProperties: true
        session_metadata:
          type: object
          additionalProperties: true
          description: Metadata applied when an invocation creates a new persistent Session.
        memory_config:
          type: object
          additionalProperties: true
          description: Reserved configuration that is stored with the Service but is not currently applied to Session execution.
        resource_config:
          type: object
          additionalProperties: true
          description: Reserved configuration that is stored with the Service but is not currently applied to Session execution.
        vault_config:
          type: object
          additionalProperties: true
          description: Reserved configuration that is stored with the Service but is not currently applied to Session execution.

    EndpointToolset:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: agent_toolset_20260401

    UpdateEndpointRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        slug:
          type: string
        agent_id:
          type: string
        agent_version:
          type: integer
          minimum: 1
        expected_agent_version:
          type: integer
          minimum: 1
          description: Current bound version required when upgrading agent_version.
        environment_id:
          type: string
        status:
          type: string
          enum: [active, disabled]
        protocols:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [rest, mcp, acp]
        config: { type: object, additionalProperties: true }
        session_metadata:
          type: object
          additionalProperties: true
          description: Metadata applied when a later invocation creates a new persistent Session.
        memory_config:
          type: object
          additionalProperties: true
          description: Reserved configuration that is stored with the Service but is not currently applied to Session execution.
        resource_config:
          type: object
          additionalProperties: true
          description: Reserved configuration that is stored with the Service but is not currently applied to Session execution.
        vault_config:
          type: object
          additionalProperties: true
          description: Reserved configuration that is stored with the Service but is not currently applied to Session execution.

    Endpoint:
      type: object
      required: [id, type, name, slug, agent_id, agent_version, environment_id, protocols, config, session_metadata, memory_config, resource_config, vault_config, status, store_status, creation_mode, run_url, acp_url, created_at, updated_at]
      properties:
        id:
          type: string
          example: ep_01abc
        type:
          type: string
          const: endpoint
        name:
          type: string
        slug:
          type: string
        agent_id:
          type: string
        agent_version:
          type: [integer, 'null']
        environment_id:
          type: string
        protocols:
          type: array
          description: Enabled transport identifiers. Public values are rest, mcp, and experimental acp; other returned values are reserved.
          items:
            type: string
        config:
          type: [object, 'null']
          additionalProperties: true
          description: Advanced Service configuration. Declarative Service responses always return null here.
        session_metadata:
          type: [object, 'null']
          additionalProperties: true
          description: Metadata applied when an invocation creates a new persistent Session.
        memory_config:
          type: [object, 'null']
          additionalProperties: true
          description: Reserved configuration stored with the Service; it is not currently applied to Session execution.
        resource_config:
          type: [object, 'null']
          additionalProperties: true
          description: Reserved configuration stored with the Service; it is not currently applied to Session execution.
        vault_config:
          type: [object, 'null']
          additionalProperties: true
          description: Reserved configuration stored with the Service; it is not currently applied to Session execution.
        status:
          type: string
          enum: [active, disabled]
        store_status:
          type: string
          enum: [private, pending_review, public, suspended]
          description: Publication and review state of the Service in the Service store.
        creation_mode:
          type: string
          enum: [declarative, advanced]
        runtime:
          type: string
          description: Present for declarative Services.
        skills:
          type: array
          description: Present for declarative Services.
          items:
            type: string
        run_url:
          type: string
          format: uri
        acp_url:
          type: string
          format: uri
          description: Experimental ACP invocation URL. Its presence does not mean ACP is enabled; inspect protocols first.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EndpointInvokeRequest:
      type: object
      properties:
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        content:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        session_id:
          type: string
          description: Persistent Session to continue. Omit to create a new Session.
      anyOf:
        - required: [input]
        - required: [content]

    EndpointInvokeAccepted:
      type: object
      description: Acceptance response for standard events sent to a persistent Session.
      required: [session_id, events]
      properties:
        session_id:
          type: string
          description: Persistent public Session identity.
        events:
          type: array
          items:
            $ref: '#/components/schemas/EndpointAcceptedEvent'

    EndpointAcceptedEvent:
      type: object
      required: [id, type, processed_at]
      properties:
        id: { type: string }
        type: { type: string, const: user.message }
        processed_at:
          type: [string, 'null']
          format: date-time
          description: Acceptance time, or null while a native delivery outcome is still unknown.

    APIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
            message:
              type: string

    ACPRequest:
      type: object
      required: [method]
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC version supplied by the client. Use 2.0.
          example: '2.0'
        id:
          description: Client request identifier echoed in the response.
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        method:
          type: string
          enum: [initialize, session/new, session/prompt, session/cancel]
        params:
          type: object
          additionalProperties: true
          description: Method-specific parameters. session/prompt and session/cancel require sessionId.
      additionalProperties: true

    ACPResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        result:
          type: object
          additionalProperties: true
          description: Method-specific result, present on success.
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data:
              type: object
              additionalProperties: true
          description: JSON-RPC error, present when the method cannot be completed.
      oneOf:
        - required: [result]
        - required: [error]

    MCPRequest:
      type: object
      required: [method]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        method: { type: string, description: MCP method name. }
        params: { type: object, additionalProperties: true }
      additionalProperties: true

    MCPResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        result: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: { type: object, additionalProperties: true }
      oneOf:
        - required: [result]
        - required: [error]

    # --- Agents ---------------------------------------------------
    CreateAgentRequest:
      type: object
      additionalProperties: true
      required: [model, name]
      properties:
        model:
          oneOf:
            - type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
              example: "anthropic/claude-sonnet-4"
            - type: object
              additionalProperties: true
              required: [id]
              properties:
                id:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
                speed:
                  type: string
                effort:
                  description: Optional model runtime hint preserved with the Agent configuration.
        name:
          type: string
        description:
          type: [string, 'null']
        system:
          type: [string, 'null']
        tools:
          type: [array, 'null']
          items:
            type: object
        mcp_servers:
          type: [array, 'null']
          description: MCP server configurations available to the Agent runtime.
        skills:
          type: [array, 'null']
          items:
            type: object
        handoffs:
          type: [array, 'null']
          description: Agent handoff configurations.
        multiagent:
          type: [object, 'null']
          description: Reserved for Claude compatibility. Omit, send null, or send an empty object; any non-empty object returns unsupported_feature.
        metadata:
          type: [object, 'null']
          additionalProperties: true
          description: Application-defined JSON metadata. The reserved _sandbase namespace is stripped from public requests.

    UpdateAgentRequest:
      type: object
      additionalProperties: true
      properties:
        version:
          type: integer
          minimum: 1
          description: Current version (optimistic lock)
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        model:
          oneOf:
            - type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
            - type: object
              additionalProperties: true
              required: [id]
              properties:
                id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$' }
                speed: { type: string }
                effort:
                  description: Optional model runtime hint preserved with the Agent configuration.
        system:
          type: [string, 'null']
        tools:
          type: [array, 'null']
        skills:
          type: [array, 'null']
        mcp_servers:
          type: [array, 'null']
        handoffs:
          type: [array, 'null']
        multiagent:
          type: [object, 'null']
          description: Reserved. Omit, send null, or send an empty object; any non-empty object returns unsupported_feature.
        metadata:
          type: [object, 'null']
          description: Full replacement for caller-owned metadata. The reserved _sandbase namespace cannot be changed through this API.

    Agent:
      type: object
      required: [id, type, name, description, model, system, tools, mcp_servers, skills, handoffs, metadata, version, created_at, updated_at, archived_at]
      properties:
        id:
          type: string
          pattern: '^agent_[0-9a-f]{8}-[0-9a-f]{3}$'
        type:
          type: string
          enum: [agent]
        name:
          type: string
        description:
          type: string
        model:
          type: object
          required: [id]
          properties:
            id: { type: string }
            effort:
              description: Optional model runtime hint preserved from the submitted model object; absent for string model input.
            speed: { type: [string, 'null'], description: Optional model runtime hint preserved from the submitted model object. }
        system:
          type: string
        tools:
          type: [array, 'null']
        mcp_servers:
          type: [array, 'null']
        skills:
          type: [array, 'null']
        handoffs:
          type: [array, 'null']
        metadata:
          type: [object, 'null']
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time

    AgentListPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
        next_page:
          type: string
          description: Opaque cursor included only when another page is available.

    MCPServer:
      type: object
      required: [name, type, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, enum: [url] }
        url: { type: string, format: uri }

    # --- Sessions -------------------------------------------------
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent:
          oneOf:
            - type: string
              description: Agent ID (uses latest version)
            - type: object
              additionalProperties: false
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [agent]
                id:
                  type: string
                version:
                  type: integer
                  minimum: 1
        agent_version_id:
          type: string
          description: Immutable AgentVersion resource ID. Takes precedence over agent.version when supplied.
        environment_id:
          type: string
          description: Optional authorized per-Session override. Omit to use the Agent-owned default Environment.
        initial_events:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SessionEventInput'
        initial_event:
          type: array
          deprecated: true
          description: SandBase legacy alias for initial_events; do not combine both fields.
          maxItems: 50
          items:
            $ref: '#/components/schemas/SessionEventInput'
        title:
          type: string
        metadata:
          type: object
        resources:
          type: array
          description: Reserved for Claude compatibility; rejected until resource attachment is supported.
          items: { type: object, additionalProperties: true }
        vault_ids:
          type: array
          description: Reserved for Claude compatibility; rejected until vault attachment is supported.
          items: { type: string }

    Session:
      type: object
      required: [id, type, status, agent, agent_id, agent_version, agent_version_id, environment_id, source, title, metadata, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
          description: Persistent public Session identity.
        type:
          type: string
          enum: [session]
        agent_id:
          type: string
        agent:
          $ref: '#/components/schemas/SessionAgentProjection'
          readOnly: true
        agent_version:
          type: [integer, 'null']
        agent_version_id:
          type: string
        environment_id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [idle, running, rescheduling, terminated]
        source:
          type: string
          enum: [direct, endpoint, deployment, store_trial]
          description: Entry point that created the Session. store_trial identifies a Service store trial Session.
        metadata:
          type: [object, 'null']
        archived_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionAPIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string }

    SessionAgentProjection:
      description: The immutable pinned Agent snapshot when available; legacy or unavailable snapshots fall back to the minimal identity projection.
      anyOf:
        - $ref: '#/components/schemas/Agent'
        - type: object
          required: [id, type, version]
          properties:
            id: { type: string, pattern: '^agent_' }
            type: { type: string, const: agent }
            version: { type: [integer, 'null'] }

    SendEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SessionEventInput'

    SessionAgentUpdate:
      type: object
      description: Session-local full replacement override; omitted fields preserve the pinned Agent snapshot.
      properties:
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        mcp_servers:
          type: array
          items: { $ref: '#/components/schemas/MCPServer' }

    SessionEventInput:
      description: >-
        Discriminated input schema. Recognition does not imply runtime support:
        user.tool_confirmation, user.custom_tool_result, user.tool_result, and
        user.define_outcome currently return HTTP 422 unsupported_event_type;
        any session_thread_id returns HTTP 422 unsupported_multiagent. The
        rejected batch is not persisted.
      discriminator:
        propertyName: type
        mapping:
          user.message: '#/components/schemas/UserMessageEventInput'
          user.interrupt: '#/components/schemas/UserInterruptEventInput'
          user.tool_confirmation: '#/components/schemas/UserToolConfirmationEventInput'
          user.custom_tool_result: '#/components/schemas/UserCustomToolResultEventInput'
          user.tool_result: '#/components/schemas/UserToolResultEventInput'
          user.define_outcome: '#/components/schemas/UserDefineOutcomeEventInput'
          interrupt.response: '#/components/schemas/SandBaseInterruptResponseEventInput'
          system.message: '#/components/schemas/SandBaseSystemMessageEventInput'
      oneOf:
        - $ref: '#/components/schemas/UserMessageEventInput'
        - $ref: '#/components/schemas/UserInterruptEventInput'
        - $ref: '#/components/schemas/UserToolConfirmationEventInput'
        - $ref: '#/components/schemas/UserCustomToolResultEventInput'
        - $ref: '#/components/schemas/UserToolResultEventInput'
        - $ref: '#/components/schemas/UserDefineOutcomeEventInput'
        - $ref: '#/components/schemas/SandBaseInterruptResponseEventInput'
        - $ref: '#/components/schemas/SandBaseSystemMessageEventInput'

    UserMessageEventInput:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [user.message] }
        content: { $ref: '#/components/schemas/UserMessageContent' }

    UserInterruptEventInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [user.interrupt] }
        session_thread_id: { type: string }

    UserToolConfirmationEventInput:
      type: object
      description: Schema-recognized but not runtime-supported; requests currently return HTTP 422 unsupported_event_type without persistence.
      additionalProperties: false
      required: [type, tool_use_id, result]
      properties:
        type: { type: string, enum: [user.tool_confirmation] }
        tool_use_id: { type: string }
        result: { type: string, enum: [allow, deny] }
        deny_message: { type: string, description: Allowed only when result is deny. }
        session_thread_id: { type: string }

    UserCustomToolResultEventInput:
      type: object
      description: Schema-recognized but not runtime-supported; requests currently return HTTP 422 unsupported_event_type without persistence.
      additionalProperties: false
      required: [type, custom_tool_use_id]
      properties:
        type: { type: string, enum: [user.custom_tool_result] }
        custom_tool_use_id: { type: string }
        content: { $ref: '#/components/schemas/ToolResultContent' }
        is_error: { type: boolean }
        session_thread_id: { type: string }

    UserToolResultEventInput:
      type: object
      description: Schema-recognized but not runtime-supported; requests currently return HTTP 422 unsupported_event_type without persistence.
      additionalProperties: false
      required: [type, tool_use_id]
      properties:
        type: { type: string, enum: [user.tool_result] }
        tool_use_id: { type: string }
        content: { $ref: '#/components/schemas/ToolResultContent' }
        is_error: { type: boolean }
        session_thread_id: { type: string }

    UserDefineOutcomeEventInput:
      type: object
      description: Schema-recognized but not runtime-supported; requests currently return HTTP 422 unsupported_event_type without persistence.
      additionalProperties: false
      required: [type, description, rubric]
      properties:
        type: { type: string, enum: [user.define_outcome] }
        description: { type: string }
        rubric: { $ref: '#/components/schemas/OutcomeRubric' }
        max_iterations: { type: integer, minimum: 1, maximum: 20, default: 3 }

    SandBaseInterruptResponseEventInput:
      type: object
      additionalProperties: false
      description: SandBase extension; not part of the Claude Managed Agents event input union.
      required: [type, interrupt_id, response]
      properties:
        type: { type: string, enum: [interrupt.response] }
        interrupt_id: { type: string }
        response: { type: object, additionalProperties: true }

    SandBaseSystemMessageEventInput:
      type: object
      additionalProperties: false
      description: SandBase extension for a privileged mid-conversation system message.
      required: [type, content]
      properties:
        type: { type: string, enum: [system.message] }
        content:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TextContentBlock' }

    UserMessageContent:
      type: array
      minItems: 1
      items:
        oneOf:
          - $ref: '#/components/schemas/TextContentBlock'
          - $ref: '#/components/schemas/ImageContentBlock'
          - $ref: '#/components/schemas/DocumentContentBlock'

    ToolResultContent:
      type: array
      minItems: 1
      items:
        oneOf:
          - $ref: '#/components/schemas/TextContentBlock'
          - $ref: '#/components/schemas/ImageContentBlock'
          - $ref: '#/components/schemas/DocumentContentBlock'
          - $ref: '#/components/schemas/SearchResultContentBlock'

    TextContentBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string }

    ImageContentBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type: { type: string, enum: [image] }
        source: { type: object, additionalProperties: true }

    DocumentContentBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type: { type: string, enum: [document] }
        source: { type: object, additionalProperties: true }
        context: { type: string }
        title: { type: string }

    SearchResultContentBlock:
      type: object
      additionalProperties: false
      required: [type, source, title, content]
      properties:
        type: { type: string, enum: [search_result] }
        source: { type: string }
        title: { type: string }
        content:
          type: array
          items: { $ref: '#/components/schemas/TextContentBlock' }
        citations: { type: object, additionalProperties: true }

    OutcomeRubric:
      oneOf:
        - $ref: '#/components/schemas/TextOutcomeRubric'
        - $ref: '#/components/schemas/FileOutcomeRubric'

    TextOutcomeRubric:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type: { type: string, enum: [text] }
        content: { type: string, maxLength: 262144 }

    FileOutcomeRubric:
      type: object
      additionalProperties: false
      required: [type, file_id]
      properties:
        type: { type: string, enum: [file] }
        file_id: { type: string }

    AcceptedSessionEvents:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionEvent'

    SessionEvent:
      type: object
      required: [id, type, processed_at, created_at]
      properties:
        id:
          type: string
          pattern: '^sevt_'
        type:
          type: string
        content:
          description: Canonical event content. Message events use an array; tool and status events may use an object.
          oneOf:
            - type: array
              items: { type: object, additionalProperties: true }
            - type: object
              additionalProperties: true
        data:
          type: object
          description: Present only for event types whose canonical payload is not content.
        stop_reason:
          type: [object, 'null']
        model_used:
          type: [string, 'null']
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        duration_ms:
          type: [integer, 'null']
        processed_at:
          type: [string, 'null']
          format: date-time
          description: Null only while a native delivery outcome is still unknown.
        created_at:
          type: string
          format: date-time

    CreateCredentialRequest:
      type: object
      required: [scope, scope_name, secret_key, value]
      properties:
        agent_id: { type: string }
        scope: { type: string, minLength: 1, maxLength: 40, description: 'Caller-defined scope. Leading and trailing whitespace is removed; control characters are rejected.' }
        scope_name: { type: string, minLength: 1, maxLength: 100, description: 'Caller-defined name within the scope. Leading and trailing whitespace is removed; control characters are rejected.' }
        secret_key: { type: string, minLength: 1, maxLength: 200, description: 'Caller-defined key. Leading and trailing whitespace is removed; control characters are rejected.' }
        value: { type: string, minLength: 1, maxLength: 8192, writeOnly: true, description: Plaintext value encrypted at rest and never returned. Blank or whitespace-only values are rejected. }
        group_key: { type: string, description: Defaults to the submitted scope_name and secret_key joined by a colon. }
        strategy: { type: string, enum: [round_robin], default: round_robin }
        weight: { type: integer, minimum: 1, default: 1 }

    UpdateCredentialRequest:
      type: object
      minProperties: 1
      properties:
        status: { type: string, enum: [active, disabled] }
        strategy: { type: string, enum: [round_robin] }
        weight: { type: integer, minimum: 1 }

    Credential:
      type: object
      description: Credential metadata. The plaintext and encrypted payload are never returned.
      required: [id, org_id, agent_id, agent_version, scope, scope_name, secret_key, value_hint, group_key, strategy, weight, status, last_used_at, cooldown_until, failure_count, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^sec_' }
        org_id: { type: string }
        agent_id: { type: string }
        agent_version: { type: [integer, 'null'] }
        scope: { type: string }
        scope_name: { type: string }
        secret_key: { type: string }
        value_hint: { type: string, description: Masked prefix/suffix hint. Treat it as sensitive metadata even though it is not the stored plaintext. }
        group_key: { type: string }
        strategy: { type: string }
        weight: { type: integer }
        status: { type: string, enum: [active, disabled] }
        last_used_at: { type: [string, 'null'], format: date-time }
        cooldown_until: { type: [string, 'null'], format: date-time }
        failure_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CredentialResponse:
      type: object
      description: Credential endpoints currently use the standard response envelope; the plaintext secret is never included.
      required: [code, data, message]
      properties:
        code: { type: integer, const: 0 }
        data: { $ref: '#/components/schemas/Credential' }
        message: { type: string, const: ok }

    CredentialListResponse:
      type: object
      required: [code, data, message]
      properties:
        code: { type: integer, const: 0 }
        data:
          type: array
          items: { $ref: '#/components/schemas/Credential' }
        message: { type: string, const: ok }

    CreateDeclarativeDeploymentRequest:
      type: object
      additionalProperties: false
      required: [name, runtime, initial_events]
      properties:
        name: { type: string, minLength: 1 }
        runtime:
          type: string
          description: Enabled declarative runtime. This release supports hermes.
          example: hermes
        description: { type: string }
        model:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        system: { type: string }
        skills:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
        tools:
          type: [array, 'null']
          maxItems: 1
          items: { $ref: '#/components/schemas/EndpointToolset' }
        initial_events:
          type: array
          minItems: 1
          description: Must contain at least one user.message event.
          items: { $ref: '#/components/schemas/SessionEventInput' }
        schedule: { type: [object, 'null'] }
        timeout_policy:
          type: object
          additionalProperties: false
          properties:
            hard_timeout_sec: { type: [integer, 'null'], minimum: 60, maximum: 604800 }
            inactivity_timeout_sec: { type: integer, minimum: 180, maximum: 3600 }
        resources: { type: array, maxItems: 0, description: Reserved; only an empty array is accepted. }
        vault_ids: { type: array, maxItems: 0, description: Reserved; only an empty array is accepted. }

    CreateDeploymentRequest:
      type: object
      required: [name, initial_events]
      anyOf:
        - required: [agent_id]
          properties:
            agent_id: {}
        - required: [agent]
          properties:
            agent: {}
      properties:
        name: { type: string }
        description: { type: string }
        agent_id:
          type: string
          description: Agent to run. This is the primary request field.
        agent:
          deprecated: true
          description: Compatibility alias for agent_id; do not send both fields.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/AgentReference'
        agent_version: { type: integer, minimum: 1 }
        environment_id:
          type: string
        initial_events:
          type: array
          minItems: 1
          description: Must contain at least one user.message event.
          items: { $ref: '#/components/schemas/SessionEventInput' }
        schedule: { type: [object, 'null'] }
        timeout_policy:
          type: object
          additionalProperties: false
          properties:
            hard_timeout_sec: { type: [integer, 'null'], minimum: 60, maximum: 604800 }
            inactivity_timeout_sec: { type: integer, minimum: 180, maximum: 3600 }
        resources: { type: array, maxItems: 0, description: Reserved; only an empty array is accepted. }
        vault_ids: { type: array, maxItems: 0, description: Reserved; only an empty array is accepted. }
        metadata: { type: object, additionalProperties: true }
        config: { type: object }

    UpdateDeploymentRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        agent:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/AgentReference'
        environment_id: { type: string }
        initial_events:
          type: array
          minItems: 1
          description: Must contain at least one user.message event.
          items: { $ref: '#/components/schemas/SessionEventInput' }
        schedule: { type: [object, 'null'] }
        timeout_policy:
          type: object
          additionalProperties: false
          properties:
            hard_timeout_sec: { type: [integer, 'null'], minimum: 60, maximum: 604800 }
            inactivity_timeout_sec: { type: integer, minimum: 180, maximum: 3600 }
        expected_version: { type: integer, minimum: 1 }
        agent_binding:
          type: object
          additionalProperties: false
          required: [agent_id]
          properties:
            agent_id: { type: string }
            agent_version: { type: integer, minimum: 1 }
            environment_id: { type: string }
        agent_config: { type: object, additionalProperties: true }
        notification_settings:
          type: [object, 'null']
          description: Set to null to remove the saved Feishu webhook. A configured webhook is encrypted and never returned.
          additionalProperties: false
          required: [feishu_webhook_url]
          properties:
            feishu_webhook_url:
              type: [string, 'null']
              format: uri
              pattern: '^https://open\.feishu\.cn/open-apis/bot/v2/hook/[A-Za-z0-9_-]+$'
              writeOnly: true
              description: Official Feishu custom-bot webhook. Set to null, or set notification_settings itself to null, to remove it.

    Deployment:
      type: object
      description: Deployment resource. List responses omit initial_events and config; detail responses may add resolved binding fields.
      required: [id, type, name, description, metadata, resources, vault_ids, agent, agent_id, agent_version, environment_id, schedule, timeout_policy, status, version, next_run_at, creation_mode, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^depl_' }
        type: { type: string, enum: [deployment] }
        name: { type: string }
        description: { type: string }
        metadata: { type: [object, 'null'], additionalProperties: true }
        resources: { type: array, items: { type: object, additionalProperties: true } }
        vault_ids: { type: array, items: { type: string } }
        agent: { $ref: '#/components/schemas/AgentReference' }
        agent_id: { type: string }
        agent_version: { type: [integer, 'null'] }
        environment_id: { type: string }
        initial_events:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/SessionEventInput' }
        schedule: { type: [object, 'null'], additionalProperties: true }
        timeout_policy: { type: object, additionalProperties: true }
        config: { type: [object, 'null'], additionalProperties: true }
        status: { type: string, enum: [active, paused, archived] }
        version: { type: integer, minimum: 1 }
        next_run_at: { type: [string, 'null'], format: date-time }
        creation_mode: { type: string, enum: [declarative, advanced] }
        runtime: { type: string, description: Present for declarative Deployments. }
        skills: { type: array, items: { type: string }, description: Present for declarative Deployments. }
        agent_binding: { type: object, additionalProperties: true }
        environment_binding: { type: object, additionalProperties: true }
        agent_config: { type: object, additionalProperties: true }
        notification_settings:
          type: object
          properties:
            feishu_webhook_configured: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EmptyObjectRequest:
      type: object
      maxProperties: 0
      additionalProperties: false

    DeploymentRun:
      type: object
      description: Durable result of one Deployment trigger's Session creation attempt; it never mirrors later Session state.
      required: [id, type, agent, deployment_id, session_id, error, trigger_context, created_at]
      properties:
        id: { type: string, pattern: '^drun_' }
        type: { type: string, enum: [deployment_run] }
        agent: { $ref: '#/components/schemas/AgentReference' }
        deployment_id: { type: string, pattern: '^depl_' }
        session_id: { type: [string, 'null'], pattern: '^sess_' }
        error:
          type: [object, 'null']
          required: [type, code, message]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
        trigger_context:
          oneOf:
            - type: 'null'
            - type: object
              required: [type]
              properties: { type: { type: string, enum: [manual] } }
            - type: object
              required: [type, scheduled_at]
              properties:
                type: { type: string, enum: [schedule] }
                scheduled_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AgentReference:
      type: object
      required: [id, type, version]
      properties:
        id: { type: string }
        type: { type: string, enum: [agent] }
        version: { type: integer, minimum: 1 }

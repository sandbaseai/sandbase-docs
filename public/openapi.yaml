        agent_id: { type: string }
        agent_version: { type: integer, minimum: 1, description: "Omit to pin the current Agent version." }
        input: { type: string, minLength: 1, maxLength: 262144 }
        model: { type: string, maxLength: 200 }
        schedule: { $ref: '#/components/schemas/ScheduleSpec' }

        agent_id: { type: string }
        agent_version: { type: integer, minimum: 1, description: "Omit to pin the current Agent version." }
        input: { type: string, maxLength: 262144, description: "Default input for invocations that do not send one." }
        model: { type: string, maxLength: 200, description: "Default model override." }
    ScheduleCreateRequest:

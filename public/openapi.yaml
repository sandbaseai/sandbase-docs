components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: SandBase API key. Treat the complete credential as an opaque secret.
    AnthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: "Supported only by `POST /v1/messages` for Anthropic SDK compatibility"
    GoogleApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Supported by Google Gemini-compatible endpoints. Takes precedence over the other key locations.
    GoogleQueryApiKey:
      type: apiKey
      in: query
      name: key
      description: Google SDK compatibility fallback. Prefer x-goog-api-key or Authorization because URLs can be logged.
    AgentsApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Accepted only by Agents platform resources (/v1/agents*, /v1/services*, /v1/schedules*, /v1/mcp-connections*, /v1/secrets*, /v1/skills*). If Authorization is also sent, both must carry the same key.

  parameters:
    AgentIdPath:
      name: agent_id
      in: path
      required: true
      schema: { type: string }
      description: Agent ID (`agt_` prefix).
    AgentVersionPath:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      description: Agent version number.
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema: { type: string }
      description: Session ID (`ses_` prefix).
    TurnIdPath:
      name: turn_id
      in: path
      required: true
      schema: { type: string }
      description: Turn ID from the turns list.
    FileIdPath:
      name: file_id
      in: path
      required: true
      schema: { type: string }
      description: Attachment ID (`fil_` prefix).
    ServiceIdPath:
      name: service_id
      in: path
      required: true
      schema: { type: string }
      description: Service ID (`svc_` prefix).
    ScheduleIdPath:
      name: schedule_id
      in: path
      required: true
      schema: { type: string }
      description: Schedule ID (`sch_` prefix).
    RunIdPath:
      name: run_id
      in: path
      required: true
      schema: { type: string }
      description: Run ID returned by invoke, trigger, or the runs list.
    NotificationChannelPath:
      name: channel
      in: path
      required: true
      schema: { type: string, enum: [feishu] }
      description: Notification channel. Only feishu is supported.
    MCPConnectionIdPath:
      name: connection_id
      in: path
      required: true
      schema: { type: string }
      description: MCP connection ID (`mcp_` prefix).
    SecretIdPath:
      name: secret_id
      in: path
      required: true
      schema: { type: string }
      description: Secret ID (`sec_` prefix).
    SkillIdPath:
      name: skill_id
      in: path
      required: true
      schema: { type: string }
      description: Skill ID (`skl_` prefix).
    SkillVersionPath:
      name: version
      in: path
      required: true
      schema: { type: string }
      description: Skill version identifier, such as "1".
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: Required. 1-128 characters without leading or trailing whitespace. Reuse the same key and body when retrying.
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: Optional. Send a stable key so retries do not create duplicates.
    OpenAIBeta:
      name: OpenAI-Beta
      in: header
      required: false
      schema: { type: string, enum: ['agents=v1'] }
      description: Optional OpenAI SDK header. When present it must be agents=v1.
    AgentsLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Page size. Values outside 1-100 return 400.
    SkillLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100, default: 20 }
      description: Page size. Values outside 0-100 return 400.
    AgentsAfter:
      name: after
      in: query
      required: false
      schema: { type: string }
      description: Cursor. Pass last_id from the previous page.
    AgentsOrder:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
      description: Sort order by creation time.
    OffsetLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 20 }
      description: Page size. Defaults to 20; non-numeric or non-positive values fall back to 20. Service, Schedule, Run, and attachment lists return 400 above 100; other offset lists cap the value at 200.
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
      description: Number of records to skip.
    AgentStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, archived, all], default: active }
      description: Lifecycle filter. Other values return 400.
    SessionLifecycleFilter:
      name: lifecycle_status
      in: query
      required: false
      schema: { type: string, enum: [active, archived, all], default: active }
      description: Lifecycle filter. Other values return 400.
    RunSourceStatusFilter:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, paused, archived, all], default: active }
      description: Lifecycle filter. Other values return 400.
    GeminiModel:
      name: model
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Bare Gemini model name, such as gemini-3.5-flash. SandBase adds the google/ catalog prefix.
  schemas:
    # --- Account --------------------------------------------------
    AccountBalance:
      type: object
      required: [org_id, balance, credit_limit, alert_threshold]
      properties:
        org_id:
          type: string
          format: uuid
        balance:
          type: string
          description: Current organization balance in USD, serialized as an exact decimal string.
        credit_limit:
          oneOf:
            - type: string
            - type: 'null'
          description: Optional USD credit limit. Null means no credit limit.
        alert_threshold:
          oneOf:
            - type: string
            - type: 'null'
          description: Optional USD balance alert threshold.

    AccountHistoryPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountHistoryItem'
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    AccountHistoryItem:
      type: object
      required: [id, model, type, execution_mode, status, latency_ms, user_cost, prompt_tokens, completion_tokens, total_tokens, cached_tokens, cache_creation_tokens, created_at, api_key_prefix]
      properties:
        id: { type: string, description: Opaque execution ID. }
        model: { type: string }
        type: { type: string }
        execution_mode: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, timeout] }
        latency_ms: { type: integer, minimum: 0 }
        user_cost:
          type: string
          description: USD cost serialized as an exact decimal string.
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cached_tokens: { type: integer, minimum: 0 }
        cache_creation_tokens: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        api_key_prefix: { type: string }
        error_message: { type: string, description: Sanitized failure message when recorded. }
        error_type: { type: string }
        completed_at: { type: string, format: date-time }
        period_settled_cost:
          type: string
          pattern: '^-?\d+\.\d{6}$'
          description: Settlement cost attributed to the selected settlement window when available.
        input_params:
          description: Parsed stored request parameters; omitted when absent or invalid JSON.
        output_result:
          description: Parsed stored output; numbers retain their JSON precision. Omitted when absent or invalid JSON.

    # --- Tasks ----------------------------------------------------
    RunRequest:
      type: object
      required: [model]
      description: Capability-specific request. Resolve the selected model's live input schema before sending fields.
      properties:
        model:
          type: string
          description: Current model or API capability identifier from the SandBase catalog.
        mode:
          type: string
          enum: [auto, sync, async, stream]
          default: auto
          description: Execution mode when supported by the selected capability. Auto uses the capability's configured default.
        stream:
          type: boolean
          default: false
          description: Requests streaming output. Equivalent to mode stream and valid only for a capability that supports streaming.
        webhook_url:
          type: string
          format: uri
          description: Optional public HTTPS callback URL for asynchronous image, video, or audio tasks. It is validated only for those tasks and ignored for other execution types.
      additionalProperties: true

    RunResponse:
      type: object
      required: [id, status, model]
      properties:
        id:
          type: string
          description: Opaque execution identifier. Use exactly as returned; no prefix is guaranteed.
        model: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed, timeout]
          description: A stored completed task can temporarily be reported as running while output transfer is still pending.
        outputs:
          type: array
          description: Extracted generated outputs when available. Omitted from non-terminal responses and also from completed responses whose output is empty, malformed, unsupported, or not yet transferred.
          items:
            type: object
            properties:
              url: { type: string, description: 'Provider output string, commonly an HTTP URL or data URI; syntax is not revalidated by this projection.' }
              content_type: { type: string }
            additionalProperties: true
        error:
          type: object
          description: Structured sanitized error for failed or timed-out runs when the stored error message is non-empty; otherwise omitted.
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string }
        usage:
          type: object
          additionalProperties: true
          description: Model-specific public usage details when available; omitted for models that do not report them.

    UploadMediaRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Image (up to 20 MB), audio (up to 50 MB), or video (up to 500 MB).
        type:
          type: string
          enum: [image, audio, video]
          description: Optional category hint. The server still uses the detected MIME type for validation and storage.

    UploadMediaResponse:
      type: object
      required: [url, filename, size, type, content_type]
      properties:
        url:
          type: string
          description: Stored media URL to pass to a supported model input.
        filename:
          type: string
          description: Original multipart filename.
        size:
          type: integer
          minimum: 0
          description: Uploaded file size in bytes.
        type:
          type: string
          description: Detected MIME type. This currently matches content_type.
        content_type:
          type: string
          description: Detected MIME type used when storing the file.

    CreateAssetRequest:
      type: object
      required: [url, asset_type]
      properties:
        url:
          type: string
          minLength: 1
          description: Source URL forwarded to the asset provider. SandBase requires a non-empty string; the provider must be able to fetch it.
        asset_type:
          type: string
          enum: [Image, Video, Audio]
        name: { type: string }

    CreateAssetResponse:
      type: object
      required: [id, asset_url, asset_type, created_at]
      properties:
        id: { type: string }
        asset_url:
          type: string
          description: Persistent asset:// reference used in generation requests.
        asset_type:
          type: string
          enum: [Image, Video, Audio]
        name: { type: string }
        created_at: { type: string, format: date-time }

    GetAssetResponse:
      type: object
      required: [id, external_id, asset_url, status, asset_type, download_url, created_at]
      properties:
        id: { type: string }
        external_id: { type: string }
        asset_url:
          type: string
          description: Persistent asset:// reference used in generation requests.
        asset_type:
          type: string
          enum: [Image, Video, Audio]
        name: { type: string }
        status:
          type: string
          description: Provider-reported asset status, returned without normalization.
        download_url:
          type: string
          description: Provider-returned download URL. It can be empty until the provider makes a URL available.
        created_at: { type: string, format: date-time }

    TaskCostResponse:
      type: object
      required: [id, status, settled, currency, cost, estimated_cost, usage]
      properties:
        id:
          type: string
          description: SandBase task ID.
        status:
          type: string
          enum: [pending, running, completed, failed, timeout]
        settled:
          type: boolean
          description: Whether final cost settlement has completed.
        currency:
          type: string
          enum: [USD]
        cost:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: USD amount with six decimal places. Not final while settled is false.
          example: '0.001234'
        estimated_cost:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: Best-effort USD estimate with six decimal places. Informational while settled is false; matches cost once settled is true.
          example: '0.001234'
        usage:
          $ref: '#/components/schemas/TaskCostUsage'

    TaskCostUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens, cached_tokens, cache_creation_tokens, reasoning_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        cached_tokens:
          type: integer
          minimum: 0
        cache_creation_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0

    TaskCostError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    APIPassthroughResponse:
      description: Capability-specific response. Its shape is defined by the selected live catalog capability and may be an object, array, or scalar.

    APIPassthroughError:
      description: Route-resolution, authentication, admission, or unified-pipeline error.
      anyOf:
        - $ref: '#/components/schemas/TaskCostError'
        - $ref: '#/components/schemas/APIKeyScopeError'
        - type: object
          required: [error, message]
          properties:
            error: { type: string }
            message: { type: string }

    # --- Models ---------------------------------------------------
    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIModelListItem'

    OpenAIModelListItem:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          description: Logical model name used in inference requests.
        object: { type: string, const: model }
        created: { type: integer, description: Unix creation timestamp. }
        owned_by: { type: string, description: Representative enabled provider or sandbase. }

    ModelDetail:
      type: object
      description: Detailed model response. Pricing is returned only in the optional model_card object.
      required: [id, name, display_name, vendor, description, type, capability_tags, skills, unified_schema, execution_mode, supported_modes, run_count, sort_order, published_at, vendor_slug, model_slug, enabled, featured, created_at, examples]
      properties:
        id:
          type: string
          format: uuid
          description: Internal model resource ID. Use name in inference requests.
        name:
          type: string
          example: openai/gpt-5.6-luna
        display_name:
          type: string
          example: GPT-5.6 Luna
        vendor:
          type: string
        description:
          type: string
        type:
          type: string
        capability_tags:
          type: [array, 'null']
          items:
            type: string
        skills:
          type: array
          description: String capability tags derived from capability_tags; empty when tags are absent or invalid.
          items:
            type: string
        unified_schema:
          type: [object, 'null']
          additionalProperties: true
        execution_mode:
          type: string
        supported_modes:
          type: [array, 'null']
          items:
            type: string
        run_count:
          type: integer
        sort_order:
          type: integer
        published_at:
          type: [string, 'null']
          format: date-time
        vendor_slug:
          type: string
        model_slug:
          type: string
        enabled:
          type: boolean
        featured:
          type: boolean
        created_at:
          type: string
          format: date-time
        model_card:
          $ref: '#/components/schemas/ModelCard'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/ModelExample'

    ModelExample:
      type: object
      required: [id, is_default, created_at]
      properties:
        id: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        input_snapshot:
          description: Parsed JSON input snapshot. Omitted when absent or invalid.
        output_snapshot:
          description: Parsed JSON output snapshot. Omitted when absent or invalid.

    ModelCard:
      type: object
      description: Model pricing and presentation data.
      required: [base_price, prompt_token_price, completion_token_price, cache_read_multiplier, cache_write_multiplier, cache_write_1h_multiplier, reasoning_price, price_formula, markup_ratio, readme, cover_url]
      properties:
        base_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        prompt_token_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        completion_token_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        cache_read_multiplier:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        cache_write_multiplier:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        cache_write_1h_multiplier:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        reasoning_price:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        price_formula:
          type: string
        markup_ratio:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        readme:
          type: string
        cover_url:
          type: string

    # --- Responses ------------------------------------------------
    ResponsesRequest:
      type: object
      required: [model]
      additionalProperties: true
      description: OpenAI-compatible request. SandBase rewrites model for the selected provider and preserves other fields.
      properties:
        model:
          type: string
          description: Model identifier from the Models API.
        input:
          description: Text, message items, or other input supported by the selected model and provider.
        instructions:
          type: string
        stream:
          type: boolean
          default: false
          description: Return sanitized OpenAI Responses Server-Sent Events.
        background:
          type: boolean
        include:
          type: array
          items: { type: string }
        max_output_tokens:
          type: integer
          minimum: 1
        max_tool_calls:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
        parallel_tool_calls:
          type: boolean
        previous_response_id:
          type: string
        reasoning:
          type: object
          additionalProperties: true
        service_tier:
          type: string
        store:
          type: boolean
        temperature:
          type: number
        text:
          type: object
          additionalProperties: true
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        top_logprobs:
          type: integer
        top_p:
          type: number
        truncation:
          type: string
        user:
          type: string

    ResponsesResponse:
      type: object
      additionalProperties: false
      description: >-
        Public OpenAI Responses fields retained by SandBase. Provider-specific top-level fields are removed;
        output items remain provider-compatible free-form objects.
      properties:
        id: { type: string }
        object: { type: string }
        created_at: { type: integer }
        status: { type: string }
        error:
          type: [object, 'null']
          additionalProperties: true
        incomplete_details:
          type: [object, 'null']
          additionalProperties: true
        instructions:
          type: [string, 'null']
        max_output_tokens: { type: [integer, 'null'] }
        max_tool_calls: { type: [integer, 'null'] }
        model: { type: string }
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        parallel_tool_calls: { type: boolean }
        previous_response_id: { type: [string, 'null'] }
        reasoning:
          type: [object, 'null']
          additionalProperties: true
        store: { type: boolean }
        temperature: { type: [number, 'null'] }
        text:
          type: object
          additionalProperties: true
        tool_choice: {}
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        top_logprobs: { type: integer }
        top_p: { type: [number, 'null'] }
        truncation: { type: string }
        usage:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens, total_tokens, input_tokens_details, output_tokens_details]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
            input_tokens_details:
              type: object
              additionalProperties: false
              required: [cached_tokens]
              properties:
                cached_tokens: { type: integer, minimum: 0 }
            output_tokens_details:
              type: object
              additionalProperties: false
              required: [reasoning_tokens]
              properties:
                reasoning_tokens: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: true
        service_tier: { type: string }
        user: { type: string }
        background: { type: boolean }

    # --- Chat Completions -----------------------------------------
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: OpenAI-compatible request. Additional provider-compatible fields are forwarded when supported by the selected route.
      properties:
        model:
          type: string
          description: Model identifier
          example: "openai/gpt-5.4"
        messages:
          type: array
          items:
            type: object
            required: [role]
            additionalProperties: true
            properties:
              role:
                type: string
                description: Message role supported by the selected provider, such as system, developer, user, assistant, or tool.
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: 'null'
              name:
                type: string
              tool_calls:
                type: array
              tool_call_id:
                type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        top_p:
          type: number
        max_tokens:
          type: integer
        stream:
          type: boolean
          default: false
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          items:
            type: object
        mcp_servers:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/MCPServer' }
        tool_choice:
          oneOf:
            - type: string
            - type: object
        parallel_tool_calls:
          type: boolean
        user:
          type: string
        response_format:
          type: object
        reasoning_effort:
          type: string
          description: Provider-compatible reasoning effort setting.
        reasoning:
          type: object
          additionalProperties: true
          description: Reasoning configuration; common fields include effort and max_tokens.
        thinking:
          type: object
          additionalProperties: true
          description: Thinking configuration; common fields include type and budget_tokens.
        extra_body:
          type: object
          additionalProperties: true
          description: Provider-specific parameters used when SandBase translates the request between protocols.
        n:
          type: integer
          default: 1
        presence_penalty:
          type: number
        frequency_penalty:
          type: number
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      additionalProperties: true
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason, logprobs]
            additionalProperties: true
            properties:
              index:
                type: integer
              message:
                type: object
                required: [role, content]
                additionalProperties: true
                properties:
                  role:
                    type: string
                  content:
                    type: [string, 'null']
                  tool_calls:
                    type: array
                  reasoning_content:
                    type: [string, 'null']
              finish_reason:
                type: [string, 'null']
                description: Provider finish reason. Values can vary by model and provider.
              logprobs:
                description: Token log probabilities when requested and supported; otherwise null.
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens, prompt_tokens_details, completion_tokens_details]
          additionalProperties: true
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
            prompt_tokens_details:
              type: object
              required: [cached_tokens, cache_write_tokens]
              properties:
                cached_tokens: { type: integer }
                cache_write_tokens: { type: integer }
            completion_tokens_details:
              type: object
              required: [reasoning_tokens]
              properties:
                reasoning_tokens: { type: integer }

    ChatCompletionError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: ['null', string] }
            param: { type: ['null', string] }

    AnthropicMessageResponse:
      type: object
      additionalProperties: true
      description: Anthropic-compatible response forwarded from the selected provider. Fields can vary with beta features.
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        model: { type: string }
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        stop_reason:
          type: [string, 'null']
        stop_sequence:
          type: [string, 'null']
        usage:
          type: object
          additionalProperties: true
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cache_read_input_tokens: { type: integer, minimum: 0 }
            cache_creation_input_tokens: { type: integer, minimum: 0 }
            cache_creation:
              type: object
              additionalProperties: true
              properties:
                ephemeral_5m_input_tokens: { type: integer, minimum: 0 }
                ephemeral_1h_input_tokens: { type: integer, minimum: 0 }

    AnthropicError:
      type: object
      required: [type, error]
      properties:
        type: { type: string, const: error }
        error:
          type: object
          required: [type, message]
          additionalProperties: true
          properties:
            type:
              type: string
              description: Anthropic error type, such as invalid_request_error, authentication_error, permission_error, request_too_large, rate_limit_error, or api_error.
            message: { type: string }

    GeminiGenerateContentRequest:
      type: object
      additionalProperties: true
      description: Google Gemini GenerateContent request. Native passthrough mappings preserve provider-defined fields; translated mappings use the documented capability subset.
      properties:
        contents:
          type: array
          items: { $ref: '#/components/schemas/GeminiContent' }
        systemInstruction:
          $ref: '#/components/schemas/GeminiContent'
        generationConfig:
          type: object
          additionalProperties: true
          properties:
            temperature: { type: number }
            topP: { type: number }
            topK: { type: integer }
            maxOutputTokens: { type: integer }
            stopSequences: { type: array, items: { type: string } }
            candidateCount: { type: integer, description: Translated mappings accept only 1 when supplied; native passthrough mappings preserve the provider request. }
            seed: { type: integer }
            presencePenalty: { type: number }
            frequencyPenalty: { type: number }
            responseMimeType: { type: string, enum: [text/plain, application/json, text/x.enum] }
            responseSchema: { type: object, additionalProperties: true }
            responseModalities:
              type: array
              items: { type: string }
              description: Native image mappings support provider image modalities. Other translated mappings may support TEXT only.
            thinkingConfig: { type: object, additionalProperties: true }
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        toolConfig: { type: object, additionalProperties: true }
        safetySettings:
          type: array
          items: { type: object, additionalProperties: true }
        cachedContent:
          type: string
          description: Passed through when the selected provider supports Gemini context caching.

    GeminiContent:
      type: object
      additionalProperties: true
      properties:
        role: { type: string, enum: [user, model] }
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Text, image inlineData, public HTTP(S) image fileData, functionCall, or functionResponse part.

    GeminiGenerateContentResponse:
      type: object
      additionalProperties: true
      properties:
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              content: { $ref: '#/components/schemas/GeminiContent' }
              finishReason: { type: string }
              index: { type: integer }
              safetyRatings: { type: array, items: { type: object, additionalProperties: true } }
        usageMetadata:
          type: object
          additionalProperties: true
          properties:
            promptTokenCount: { type: integer, minimum: 0 }
            candidatesTokenCount: { type: integer, minimum: 0 }
            totalTokenCount: { type: integer, minimum: 0 }
            cachedContentTokenCount: { type: integer, minimum: 0 }
            thoughtsTokenCount: { type: integer, minimum: 0 }
        promptFeedback: { type: object, additionalProperties: true }
        modelVersion: { type: string }
        responseId: { type: string }

    GeminiInteractionRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      description: |
        Google Interactions request. Except for fields used for routing and lifecycle control, fields are forwarded to
        the selected upstream. Agent interactions are not supported. background and stream cannot both be true.
      properties:
        model:
          type: string
          minLength: 1
          description: Logical SandBase model name. The response echoes this name instead of an upstream model identifier.
        input:
          description: Google Interactions input; it can be text, an object, or an array of typed input items.
        stream:
          type: boolean
          default: false
          description: Requests an SSE event stream when the selected model supports it.
        background:
          type: boolean
          default: false
          description: Requests durable background execution and an immediately pollable in_progress Interaction.
        previous_interaction_id:
          type: string
          description: Previous Interaction ID. SandBase keeps the request on the same upstream provider when the mapping is still available.
        store:
          type: boolean
          description: Forwarded upstream. Stored upstream state may be required for previous_interaction_id.
        system_instruction: { type: string }
        tools: { type: array, items: { type: object, additionalProperties: true } }
        generation_config: { type: object, additionalProperties: true }
        response_format:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        response_modalities: { type: array, items: { type: string } }

    GeminiInteraction:
      type: object
      required: [id, object, model, status]
      additionalProperties: true
      properties:
        id:
          type: string
          description: Upstream Interaction ID used by GET and previous_interaction_id.
        object: { type: string, const: interaction }
        model:
          type: string
          description: Logical SandBase model name supplied by the client.
        role: { type: string }
        status:
          type: string
          enum: [in_progress, requires_action, completed, failed, cancelled, incomplete]
        created: { type: string }
        updated: { type: string }
        steps:
          type: array
          description: Polymorphic Google Interaction steps. Unknown step and content types are preserved.
          items: { type: object, additionalProperties: true }
        usage:
          $ref: '#/components/schemas/GeminiInteractionUsage'

    GeminiInteractionUsage:
      type: object
      additionalProperties: true
      properties:
        total_input_tokens: { type: integer, minimum: 0 }
        total_output_tokens: { type: integer, minimum: 0 }
        total_cached_tokens: { type: integer, minimum: 0 }
        total_thought_tokens: { type: integer, minimum: 0 }
        total_tool_use_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        input_tokens_by_modality:
          type: array
          items: { $ref: '#/components/schemas/GeminiInteractionModalityUsage' }
        output_tokens_by_modality:
          type: array
          items: { $ref: '#/components/schemas/GeminiInteractionModalityUsage' }

    GeminiInteractionModalityUsage:
      type: object
      required: [modality, tokens]
      additionalProperties: true
      properties:
        modality: { type: string }
        tokens: { type: integer, minimum: 0 }

    GeminiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          additionalProperties: true
          properties:
            code: { type: integer }
            message: { type: string }
            status:
              type: string
              description: Google canonical error status, such as INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, RESOURCE_EXHAUSTED, INTERNAL, UNAVAILABLE, or DEADLINE_EXCEEDED.

    VolcengineContentsGenerationRequest:
      type: object
      required: [model, content]
      additionalProperties: true
      properties:
        model:
          type: string
          enum: [doubao-seedance-2-0-260128, doubao-seedance-2-0-fast-260128, doubao-seedance-2-5-260628]
        content:
          type: array
          minItems: 1
          description: Must include text. Media items select image-to-video or reference-to-video mode according to role.
          items: { $ref: '#/components/schemas/VolcengineContentItem' }
        callback_url: { type: string, minLength: 1, description: Receives the terminal task response. }
        duration: { type: integer }
        resolution: { type: string }
        ratio: { type: string }
        generate_audio: { type: boolean }
        seed: { type: integer }
        camera_fixed: { type: boolean }
        watermark: { type: boolean }
        draft: { type: boolean }
        return_last_frame: { type: boolean }
        service_tier: { type: string }
        execution_expires_after: { type: integer }
        frames: { type: integer }
        framespersecond: { type: integer }
        tools: { type: array, items: { type: object, additionalProperties: true } }

    VolcengineContentItem:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string, enum: [text, image_url, video_url, audio_url] }
        text: { type: string }
        image_url:
          oneOf:
            - { type: string }
            - { type: object, required: [url], properties: { url: { type: string } } }
        video_url:
          oneOf:
            - { type: string }
            - { type: object, required: [url], properties: { url: { type: string } } }
        audio_url:
          oneOf:
            - { type: string }
            - { type: object, required: [url], properties: { url: { type: string } } }
        role: { type: string, enum: [first_frame, last_frame, reference_image, reference_video, reference_audio] }

    VolcengineTaskCreated:
      type: object
      required: [id]
      properties:
        id: { type: string }

    VolcengineTask:
      type: object
      required: [id, model, status, created_at, updated_at, content, usage]
      additionalProperties: true
      properties:
        id: { type: string }
        model: { type: string }
        status: { type: string, enum: [queued, running, cancelled, succeeded, failed, expired] }
        created_at: { type: integer, format: int64, description: Unix timestamp in seconds. }
        updated_at: { type: integer, format: int64, description: Unix timestamp in seconds. }
        content:
          type: object
          properties:
            video_url: { type: string }
            last_frame_url: { type: string }
            file_url: { type: string }
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens, prompt_tokens_details, completion_tokens_details]
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
            prompt_tokens_details: { type: object, additionalProperties: true }
            completion_tokens_details: { type: object, additionalProperties: true }
        error: { $ref: '#/components/schemas/VolcengineTaskFailure' }
        failure_reason: { $ref: '#/components/schemas/VolcengineTaskFailure' }

    VolcengineTaskFailure:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    VolcengineTaskList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VolcengineTask' } }
        total: { type: integer, minimum: 0 }

    VolcengineError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type]
          properties:
            code: { type: string, description: 'InvalidParameter, AuthenticationError, PermissionDenied, ResourceNotFound, RateLimitExceeded, or InternalServiceError.' }
            message: { type: string }
            type: { type: string, description: HTTP-style Volcengine error type. }

    # --- Embeddings -----------------------------------------------
    EmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      description: OpenAI-compatible request. Additional provider-compatible fields are forwarded unchanged.
      properties:
        model:
          type: string
          description: Embedding model identifier.
          example: "alibaba/text-embedding-v4"
        input:
          description: Text, token IDs, or a batch of texts or token-ID arrays to embed. Provider limits apply.
          oneOf:
            - type: string
              example: "SandBase provides a unified API for AI models, agents, and developer tools."
            - type: array
              items:
                type: string
              example:
                - "First document"
                - "Second document"
            - type: array
              items:
                type: integer
            - type: array
              items:
                type: array
                items:
                  type: integer
        dimensions:
          type: integer
          minimum: 1
          description: Optional output dimension when supported by the selected model. SandBase does not impose a universal dimension list.
          example: 1024
        encoding_format:
          type: string
          description: Requested embedding encoding. Support is provider- and model-specific.
          enum: [float, base64]
          default: float

    EmbeddingResponse:
      type: object
      required: [object, data, model, usage]
      additionalProperties: true
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            additionalProperties: true
            properties:
              object:
                type: string
                enum: [embedding]
              index:
                type: integer
              embedding:
                oneOf:
                  - type: array
                    items:
                      type: number
                      format: float
                  - type: string
                    description: Base64-encoded vector when encoding_format is base64.
        model:
          type: string
          example: "alibaba/text-embedding-v4"
        usage:
          type: object
          required: [prompt_tokens, total_tokens]
          additionalProperties: true
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer

    EmbeddingError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: ['null', string] }
            param: { type: ['null', string] }

    # --- OpenAI-compatible Images --------------------------------
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      properties:
        model:
          type: string
          enum: [gpt-image-2, gpt-image-2.5-flare, gpt-image-2.5-sunburst]
        prompt:
          type: string
          minLength: 1
        n:
          type: integer
          minimum: 1
        size:
          type: string
          description: Output size supported by the selected model, such as 1024x1024, 1024x1536, 1536x1024, or auto.
        quality:
          type: string
          description: Output quality supported by the selected model, such as low, medium, high, or auto.
        background:
          type: string
          description: Background setting such as transparent, opaque, or auto.
        output_format:
          type: string
          description: Output encoding such as png, webp, or jpeg.
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        moderation:
          type: string
        user:
          type: string
        stream:
          type: boolean
          const: false
          default: false
          description: Streaming is not supported by this SandBase endpoint.
        mode:
          type: string
          const: sync
          default: sync

    ImageEditRequest:
      type: object
      required: [model, prompt, image]
      additionalProperties: true
      properties:
        model:
          type: string
          enum: [gpt-image-2, gpt-image-2.5-flare, gpt-image-2.5-sunburst]
        prompt:
          type: string
          minLength: 1
        image:
          oneOf:
            - type: string
              format: binary
            - type: array
              items:
                type: string
                format: binary
          description: Source image file. Repeat the multipart field to provide multiple images.
        mask:
          type: string
          format: binary
        n:
          type: integer
          minimum: 1
        size:
          type: string
        quality:
          type: string
        background:
          type: string
        input_fidelity:
          type: string
        output_format:
          type: string
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        user:
          type: string
        stream:
          type: boolean
          const: false
          default: false
          description: Streaming is not supported by this SandBase endpoint.
        mode:
          type: string
          const: sync
          default: sync

    ImagesResponse:
      type: object
      required: [data, usage]
      additionalProperties: true
      properties:
        created:
          type: integer
        data:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            anyOf:
              - required: [b64_json]
              - required: [url]
            properties:
              b64_json:
                type: string
                description: Base64-encoded image data.
              url:
                type: string
                format: uri
              revised_prompt:
                type: string
        usage:
          type: object
          required: [input_tokens, output_tokens, total_tokens, input_tokens_details]
          additionalProperties: true
          properties:
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
            total_tokens:
              type: integer
              minimum: 0
            input_tokens_details:
              type: object
              required: [text_tokens, image_tokens]
              additionalProperties: true
              properties:
                text_tokens: { type: integer, minimum: 0 }
                image_tokens: { type: integer, minimum: 0 }
                cached_text_tokens: { type: integer, minimum: 0 }
                cached_image_tokens: { type: integer, minimum: 0 }
                cached_tokens: { type: integer, minimum: 0 }

    OpenAIImagesError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, param]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: ['null', string] }
            param: { type: ['null', string] }

    APIKeyScopeError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, const: insufficient_scope }
            message: { type: string }
            request_id: { type: string }

    MCPServer:
      type: object
      required: [name, type, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { type: string, enum: [url] }
        url: { type: string, format: uri }
    # --- Agents platform -------------------------------------------
    AgentsError:
      type: object
      description: Error envelope for Agents platform resources. message is a fixed, safe sentence for each code.
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, param, message]
          properties:
            type: { type: string, enum: [invalid_request_error, authentication_error, server_error] }
            code:
              type: string
              description: Stable machine-readable code. Unknown future codes should be treated by HTTP status.
              enum: [unauthorized, insufficient_scope, authorization_unavailable, org_disabled, spending_limit_exceeded, quota_exceeded, concurrency_limit, admission_unavailable, invalid_request, not_found, conflict, session_input_pending, session_input_expired, session_environment_unavailable, tenant_provisioning_failed, tenant_unavailable, executor_rejected, executor_unavailable, executor_contract_error, skill_not_found, skill_unavailable, skill_runtime_incompatible, storage_unavailable, internal_error]
            param: { type: 'null' }
            message: { type: string }
    AgentsCursorList:
      type: object
      required: [object, data, has_more, first_id, last_id]
      properties:
        object: { type: string, const: list }
        data: { type: array, items: { type: object, additionalProperties: true } }
        has_more: { type: boolean }
        first_id: { type: [string, 'null'] }
        last_id: { type: [string, 'null'], description: "Pass as after to read the next page." }
    AgentsOffsetList:
      type: object
      required: [data, total, limit, offset]
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    EmptyObject:
      type: object
      additionalProperties: false
      maxProperties: 0
    RowVersionRequest:
      type: object
      additionalProperties: false
      required: [row_version]
      properties:
        row_version: { type: integer, minimum: 1, description: "The row_version you last read. A stale value returns 409." }
    DeletedFlag:
      type: object
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    AgentSkillRef:
      type: object
      additionalProperties: false
      required: [skill_id]
      properties:
        skill_id: { type: string, description: "Skill ID (`skl_` prefix) owned by your organization." }
        version: { type: [string, 'null'], description: "Pinned Skill version. null uses the default version, resolved when a Session is created." }
    AgentMCPConnectionRef:
      type: object
      additionalProperties: false
      required: [connection_id, server_label]
      properties:
        connection_id: { type: string, description: "MCP connection ID (`mcp_` prefix)." }
        server_label: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_-]{0,63}$', description: "Label unique within the Agent." }
        allowed_tools: { type: [array, 'null'], maxItems: 256, items: { type: string, minLength: 1, maxLength: 128 }, description: "null allows every tool; an empty array allows none." }
        required: { type: boolean, description: "Whether the Session must load this server." }
    AgentFunctionTool:
      type: object
      additionalProperties: false
      required: [type, name, description, parameters]
      description: Saved function tool. Runs that request a client-side tool result are not supported yet.
      properties:
        type: { type: string, const: function }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string }
        parameters: { type: object, description: "JSON Schema whose type is object." }
        defer_loading: { type: boolean }
    AgentWebSearchTool:
      type: object
      additionalProperties: false
      required: [type]
      description: At most one per Agent. Sessions, Services, and Schedules currently require mode disabled.
      properties:
        type: { type: string, const: web_search }
        mode: { type: string, enum: [disabled, cached, live] }
        context_size: { type: string, enum: [low, medium, high] }
        allowed_domains: { type: array, items: { type: string } }
        location:
          type: object
          additionalProperties: false
          properties:
            city: { type: string }
            country: { type: string }
            region: { type: string }
            timezone: { type: string }
    AgentText:
      type: object
      additionalProperties: false
      properties:
        format:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [text, json_schema] }
            schema: { type: object, description: "Required for json_schema; its type must be object." }
        verbosity: { type: string, enum: [low, medium, high] }
    AgentReasoning:
      type: object
      additionalProperties: false
      properties:
        effort: { type: [string, 'null'], enum: [none, minimal, low, medium, high, xhigh, max, null] }
        summary: { type: [string, 'null'], enum: [concise, detailed, auto, null] }
    AgentConfigFields:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        model: { type: string, minLength: 1, maxLength: 200, description: "Model ID from the Models API, such as deepseek/deepseek-v4-flash." }
        instructions: { type: string, maxLength: 262144 }
        description: { type: string, maxLength: 4096 }
        metadata: { type: object, maxProperties: 16, additionalProperties: { type: string, maxLength: 512 }, description: "Keys up to 64 characters." }
        service_tier: { type: string, enum: [auto, default, flex, priority, fast], default: auto }
        runtime_profile: { type: string, enum: [codex, claude, mcode], default: codex }
        tools:
          type: array
          maxItems: 64
          items:
            oneOf:
              - $ref: '#/components/schemas/AgentFunctionTool'
              - $ref: '#/components/schemas/AgentWebSearchTool'
        text: { $ref: '#/components/schemas/AgentText' }
        reasoning: { $ref: '#/components/schemas/AgentReasoning' }
        skills: { type: array, items: { $ref: '#/components/schemas/AgentSkillRef' } }
        mcp_connections: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/AgentMCPConnectionRef' } }
    AgentCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AgentConfigFields'
        - type: object
          required: [model]
          properties:
            note: { type: string, description: "Optional change note recorded on version 1." }
            multi_agent: { type: 'null', description: "Only null is accepted." }
    AgentUpdateRequest:
      type: object
      additionalProperties: false
      description: SDK-style partial update. description and note are not accepted here; use PATCH for them.
      properties:
        name: { type: string, maxLength: 128 }
        model: { type: string, minLength: 1, maxLength: 200 }
        instructions: { type: string, maxLength: 262144 }
        metadata: { type: object, maxProperties: 16, additionalProperties: { type: string, maxLength: 512 } }
        service_tier: { type: string, enum: [auto, default, flex, priority, fast] }
        runtime_profile: { type: string, enum: [codex, claude, mcode] }
        tools: { type: array, maxItems: 64, items: { type: object } }
        text: { $ref: '#/components/schemas/AgentText' }
        reasoning: { $ref: '#/components/schemas/AgentReasoning' }
        skills: { type: array, items: { $ref: '#/components/schemas/AgentSkillRef' } }
        mcp_connections: { type: array, items: { $ref: '#/components/schemas/AgentMCPConnectionRef' } }
    AgentReplaceRequest:
      allOf:
        - $ref: '#/components/schemas/AgentConfigFields'
        - type: object
          required: [row_version]
          description: Supplied fields replace saved values; explicit null values are rejected.
          properties:
            note: { type: string, description: "Change note recorded on the new version." }
            row_version: { type: integer, minimum: 1 }
    AgentRowVersionRequest:
      $ref: '#/components/schemas/RowVersionRequest'
    AgentRestoreRequest:
      type: object
      additionalProperties: false
      required: [source_version, row_version]
      properties:
        source_version: { type: integer, minimum: 1, description: "Version whose configuration becomes the new current version." }
        row_version: { type: integer, minimum: 1 }
    AgentCloneRequest:
      type: object
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, description: "Catalog version to copy. Defaults to the current public version." }
        name: { type: string, maxLength: 128, description: "Name for the new Agent." }
    Agent:
      type: object
      required: [id, object, model, name, instructions, tools, text, reasoning, service_tier, multi_agent, visibility, status, version, row_version, projection_status, runtime_profile, description, metadata, mcp_connections, skills, created_at, updated_at, archived_at]
      properties:
        id: { type: string, description: "Agent ID (`agt_` prefix)." }
        object: { type: string, const: agent }
        model: { type: string }
        name: { type: [string, 'null'] }
        instructions: { type: [string, 'null'] }
        tools: { type: array, items: { type: object } }
        text: { $ref: '#/components/schemas/AgentText' }
        reasoning: { type: object }
        service_tier: { type: string }
        multi_agent: { type: object, description: "Always reports enabled false." }
        visibility: { type: string, enum: [private, public] }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, description: "Current version number." }
        row_version: { type: integer, description: "Compare-and-set token for PATCH, archive, unarchive, and restore." }
        projection_status: { type: string, description: "Whether the current version is ready for execution. Sessions require ready." }
        runtime_profile: { type: string, enum: [codex, claude, mcode] }
        description: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        mcp_connections: { type: array, items: { $ref: '#/components/schemas/AgentMCPConnectionRef' } }
        skills: { type: array, items: { $ref: '#/components/schemas/AgentSkillRef' } }
        created_at: { type: integer, description: "Unix seconds." }
        updated_at: { type: integer, description: "Unix seconds." }
        archived_at: { type: [integer, 'null'], description: "Unix seconds." }
        failure_code: { type: string }
    AgentList:
      allOf:
        - $ref: '#/components/schemas/AgentsCursorList'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Agent' } }
    AgentDeleted:
      type: object
      required: [id, object, deleted]
      properties:
        id: { type: string }
        object: { type: string, const: agent.deleted }
        deleted: { type: boolean, const: true }
    AgentVersion:
      type: object
      required: [version, agent, checksum, created_at]
      properties:
        version: { type: integer }
        agent: { type: object, description: "Saved configuration document of this version." }
        checksum: { type: string }
        note: { type: string, description: "Present only when the change that created this version sent a note." }
        created_by: { type: string }
        created_at: { type: string, format: date-time, description: "ISO 8601 string, unlike the Unix-second timestamps on Agent objects." }
        failure_code: { type: string }
    AgentVersionList:
      allOf:
        - $ref: '#/components/schemas/AgentsOffsetList'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/AgentVersion' } }
    AgentCatalogEntry:
      type: object
      required: [id, object, visibility, version, name, description, model, created_at, updated_at]
      properties:
        id: { type: string }
        object: { type: string, const: agent }
        visibility: { type: string, const: public }
        version: { type: integer }
        name: { type: string }
        description: { type: string }
        model: { type: string }
        skills: { type: array, items: { type: object } }
        configuration: { type: object, description: "Read-only configuration (name, description, model, instructions, runtime_profile, metadata, tools, text, reasoning, skills)." }
        created_at: { type: integer }
        updated_at: { type: integer }
        failure_code: { type: string }
    AgentCatalogList:
      allOf:
        - $ref: '#/components/schemas/AgentsCursorList'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/AgentCatalogEntry' } }
    ModelProvider:
      type: object
      additionalProperties: false
      description: Write-only model credential. Omit it to run with the calling SandBase API key. Never returned.
      properties:
        type: { type: string, enum: [sandbase, custom], default: sandbase }
        base_url: { type: string, format: uri, description: "Required for custom. HTTPS only, without credentials, query, or fragment. Not allowed for sandbase." }
        api_key: { type: string, description: "Required for custom. Optional for sandbase, where it defaults to the calling key." }
    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: { type: string, description: "Saved Agent ID (`agt_` prefix). Inline Agents are not supported." }
        version: { type: integer, minimum: 1, description: "Agent version. Defaults to the current version." }
        title: { type: string }
        agent: { type: object, additionalProperties: false, properties: { model: { type: string } }, description: "OpenAI SDK form of the model override." }
        model: { type: string, maxLength: 200, description: "Model override for this Session. Must equal agent.model when both are sent." }
        environment: { type: object, additionalProperties: false, properties: { type: { type: string, const: openai_hosted } }, description: "OpenAI SDK compatibility only. Sessions always run in the SandBase hosted cloud, so omit this field in direct HTTP calls. The OpenAI SDK requires it; {\"type\":\"openai_hosted\"} is accepted and any other value returns 400." }
        input:
          description: 'Optional first input: a string, or an array with exactly one message, e.g. [{"role":"user","content":[{"type":"input_text","text":"..."}]}]. A bare object returns 400.'
          oneOf:
            - { type: string }
            - type: array
              minItems: 1
              maxItems: 1
              items: { type: object, required: [role, content], properties: { role: { type: string, const: user }, content: { type: array, items: { type: object, required: [type, text], properties: { type: { type: string, const: input_text }, text: { type: string } } } } } }
        metadata: { type: object, maxProperties: 16, additionalProperties: { type: string, maxLength: 512 } }
        stream: { type: boolean, const: false, description: "true returns 400." }
        model_provider: { $ref: '#/components/schemas/ModelProvider' }
    SessionFailure:
      type: object
      required: [code, message, action]
      properties:
        code: { type: string, enum: [session_creation_rejected, execution_failed, model_authentication_failed, model_rate_limited, model_quota_exceeded, context_limit_exceeded, environment_connection_timeout, runtime_unavailable, model_request_failed, model_configuration_rejected, session_not_ready, session_execution_unavailable, session_configuration_unavailable, session_snapshot_unavailable] }
        message: { type: string }
        action: { type: string, description: "Suggested next step, such as retry_later, inspect_history, create_new_session, check_model_account, or create_session_with_updated_model_provider." }
        retryable: { type: boolean }
    Session:
      type: object
      required: [id, object, agent, agent_id, agent_version, title, model, environment, metadata, status, lifecycle_status, sync_status, execution_status, failure, row_version, required_actions, vault_ids, created_at, last_active_at, updated_at, archived_at]
      properties:
        id: { type: string, description: "Session ID (`ses_` prefix)." }
        object: { type: string, const: agent.session }
        agent: { type: object, description: "OpenAI-shaped snapshot of the effective Agent configuration (id, name, model, instructions, multi_agent, reasoning, service_tier, text, tools)." }
        agent_id: { type: string }
        agent_version: { type: integer }
        title: { type: string }
        model: { type: string }
        environment:
          type: object
          description: Echo of the hosted execution context, kept for OpenAI SDK compatibility. It is not a Sandbox instance and needs no action from clients.
          properties:
            id: { type: string }
            type: { type: string, const: openai_hosted }
            skills: { type: array, items: { type: object } }
        metadata: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [idle, in_progress, requires_action, failed], description: "Execution status. requires_action is not supported yet and surfaces as a 502 executor_contract_error." }
        lifecycle_status: { type: string, enum: [active, archived] }
        sync_status: { type: string }
        execution_status: { type: string }
        failure: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SessionFailure' }] }
        row_version: { type: integer }
        required_actions: { type: array, items: {} }
        vault_ids: { type: array, items: { type: string } }
        usage: { type: [object, 'null'], description: "Token usage; null until a turn reports usage." }
        created_at: { type: integer }
        last_active_at: { type: integer }
        updated_at: { type: integer }
        archived_at: { type: [integer, 'null'] }
        source: { type: [string, 'null'], enum: [direct, service, schedule, null] }
        source_id: { type: [string, 'null'], description: "Service or Schedule ID when source is service or schedule." }
        source_failure_code: { type: string }
    SessionList:
      allOf:
        - $ref: '#/components/schemas/AgentsCursorList'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/Session' } }
    SessionUpdateRequest:
      type: object
      additionalProperties: false
      required: [metadata]
      properties:
        metadata: { type: object, maxProperties: 16, additionalProperties: { type: string, maxLength: 512 }, description: "Replaces the whole metadata map." }
    SessionRenameRequest:
      type: object
      additionalProperties: false
      required: [title, row_version]
      properties:
        title: { type: string, maxLength: 512 }
        row_version: { type: integer, minimum: 1 }
    SessionRowVersionRequest:
      $ref: '#/components/schemas/RowVersionRequest'
    SessionEventsRequest:
      type: object
      additionalProperties: false
      description: 'Either events (exactly one event) or the SandBase extension input/file_ids.'
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type: { type: string, enum: [agent.session.input.message, agent.session.input.cancel] }
              input: { description: 'For input.message: a string, or exactly one user message with one input_text part. Must be omitted for input.cancel.' }
        input: { type: string, maxLength: 262144, description: "SandBase extension. Text input, non-empty." }
        file_ids: { type: array, maxItems: 10, items: { type: string }, description: "SandBase extension. Up to 10 distinct ready attachments." }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /docs {
        return 301 /docs/;
    }

    location = /docs/ {
        rewrite ^ /docs/index.html last;
    }

    # Older API Reference URLs now point to the corresponding conceptual guides.
    location = /docs/api-reference/getting-started/first-call { return 301 /docs/getting-started/first-call; }
    location = /docs/api-reference/getting-started/api-keys { return 301 /docs/getting-started/api-keys; }
    location = /docs/api-reference/guides { return 301 /docs/guides/; }
    location = /docs/api-reference/guides/ { return 301 /docs/guides/; }
    location ~ ^/docs/api-reference/guides/(.+)$ { return 301 /docs/guides/$1; }
    location = /docs/api-reference/agent-friendly { return 301 /docs/for-agents/; }
    location = /docs/api-reference/agent-friendly/ { return 301 /docs/for-agents/; }
    location ~ ^/docs/api-reference/agent-friendly/(.+)$ { return 301 /docs/for-agents/$1; }
    location = /docs/api-reference/models/supported { return 301 /docs/models/supported; }
    location = /docs/api-reference/models/capabilities { return 301 /docs/models/capabilities; }

    location ~ ^/docs/(.+)\.html$ {
        return 301 /docs/$1;
    }

    # Model category pages coexist with same-named directories of child pages.
    # Keep this exception narrow so unrelated docs retain the default routing.
    location ~ ^(?<page_uri>/docs/model-api-reference/(?:llm-models|image-generation|video-generation|audio-generation))/$ {
        try_files $page_uri.html $page_uri/index.html =404;
    }

    location ~ ^(?<category_uri>/docs/model-api-reference/(?:llm-models|image-generation|video-generation|audio-generation))$ {
        try_files $category_uri.html =404;
    }

    location /docs/ {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
